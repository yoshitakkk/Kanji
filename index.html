<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>漢字マスター！しょうがくせいのかんじドリル</title>

    <!-- Data URI Favicon (Pencil Emoji) -->
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>✏️</text></svg>">

    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>

    <!-- Google Fonts: M PLUS Rounded 1c -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@400;700;800;900&display=swap" rel="stylesheet">

    <style>
        body {
            font-family: 'M PLUS Rounded 1c', sans-serif;
            user-select: none;
            -webkit-user-select: none;
            touch-action: manipulation;
        }

        /* Genko Yoshi style canvas grid background */
        .genko-grid {
            background-color: #ffffff;
            background-image: 
                linear-gradient(to right, rgba(251, 191, 36, 0.3) 1px, transparent 1px),
                linear-gradient(to bottom, rgba(251, 191, 36, 0.3) 1px, transparent 1px),
                linear-gradient(to right, rgba(245, 158, 11, 0.55) 2px, transparent 2px),
                linear-gradient(to bottom, rgba(245, 158, 11, 0.55) 2px, transparent 2px);
            background-size: 20px 20px, 20px 20px, 50% 50%, 50% 50%;
            background-position: -1px -1px, -1px -1px, -1px -1px, -1px -1px;
        }

        /* Essential touch interaction lock on canvas */
        canvas {
            touch-action: none;
        }

        /* Short bounce animation */
        @keyframes bounce-short {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-8px); }
        }
        .animate-bounce-short {
            animation: bounce-short 0.5s ease-in-out infinite;
        }

        /* Pop in animation for modals */
        @keyframes pop-in {
            0% { transform: scale(0.85); opacity: 0; }
            100% { transform: scale(1); opacity: 1; }
        }
        .animate-pop-in {
            animation: pop-in 0.22s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
        }
    </style>
</head>
<body class="bg-amber-50 text-slate-800 min-h-screen flex flex-col justify-between">

    <!-- Navigation Header -->
    <header class="bg-gradient-to-r from-amber-400 via-amber-500 to-orange-400 text-white shadow-md sticky top-0 z-20">
        <div class="max-w-2xl mx-auto px-3 py-2 flex flex-col sm:flex-row items-center justify-between gap-2">
            <!-- Logo & Title -->
            <div class="flex items-center gap-2 cursor-pointer" onclick="resetToHome()">
                <span class="text-3xl">✏️</span>
                <h1 class="text-xl sm:text-2xl font-black tracking-wide drop-shadow-sm">漢字マスター！</h1>
            </div>

            <!-- Grade, Term & Mode Selectors -->
            <div class="flex items-center flex-wrap justify-center gap-1.5 text-xs sm:text-sm font-bold text-slate-800">
                <!-- Grade Selector -->
                <select id="gradeSelect" class="bg-white rounded-lg px-2 py-1 shadow border border-amber-200 outline-none focus:ring-2 focus:ring-orange-300">
                    <option value="1">1年生 (80字)</option>
                    <option value="2">2年生 (160字)</option>
                    <option value="3">3年生 (200字)</option>
                </select>

                <!-- Term Selector -->
                <select id="termSelect" class="bg-white rounded-lg px-2 py-1 shadow border border-amber-200 outline-none focus:ring-2 focus:ring-orange-300">
                    <option value="all">ぜんぶ (全学期)</option>
                    <option value="1">1学期</option>
                    <option value="2">2学期</option>
                    <option value="3">3学期</option>
                </select>

                <!-- Mode Selector -->
                <select id="modeSelect" class="bg-white rounded-lg px-2 py-1 shadow border border-amber-200 outline-none focus:ring-2 focus:ring-orange-300">
                    <option value="read">📖 よみ (読み問題)</option>
                    <option value="write">✏️ かき (書き問題)</option>
                </select>
            </div>
        </div>

        <!-- Persistent Stats Scorebar -->
        <div class="bg-amber-600/95 text-amber-50 text-xs sm:text-sm px-3 py-1 font-bold">
            <div class="max-w-2xl mx-auto flex justify-around items-center">
                <div class="flex items-center gap-1.5">
                    <span>📖 よみ:</span>
                    <span class="text-yellow-300">⭐ <span id="readStarsCount">0</span></span>
                    <span class="text-amber-200 ml-1">🏅 <span id="readMedalsCount">0</span></span>
                </div>
                <div class="h-4 w-px bg-amber-400"></div>
                <div class="flex items-center gap-1.5">
                    <span>✏️ かき:</span>
                    <span class="text-yellow-300">⭐ <span id="writeStarsCount">0</span></span>
                    <span class="text-amber-200 ml-1">🏅 <span id="writeMedalsCount">0</span></span>
                </div>
            </div>
        </div>
    </header>

    <!-- Main Content Viewport -->
    <main class="max-w-xl mx-auto w-full px-3 py-3 flex-grow flex flex-col">

        <!-- Progress Indicator -->
        <div class="mb-3 bg-white rounded-xl p-2.5 shadow-sm border border-amber-200 flex items-center justify-between gap-3">
            <div class="flex items-center gap-1 text-xs sm:text-sm font-black text-amber-700 min-w-[80px]">
                <span>だい <span id="currentQIndex" class="text-base sm:text-lg text-orange-600">1</span> / 10 問</span>
            </div>
            <div class="w-full bg-slate-100 rounded-full h-3 overflow-hidden border border-slate-200">
                <div id="sessionProgressBar" class="bg-gradient-to-r from-amber-400 to-orange-500 h-full w-10 transition-all duration-300 rounded-full"></div>
            </div>
            <button onclick="restartSession()" class="text-xs bg-amber-100 hover:bg-amber-200 text-amber-800 font-bold px-2.5 py-1 rounded-lg transition border border-amber-300 flex items-center gap-1 shrink-0">
                🔄 最初から
            </button>
        </div>

        <!-- Question Sentence Card -->
        <div class="bg-white rounded-2xl p-4 sm:p-5 shadow-md border-2 border-amber-200 text-center relative mb-4 flex flex-col justify-center items-center min-h-[110px]">
            <!-- Mute / Unmute Button -->
            <button onclick="toggleAudio()" id="audioToggleBtn" title="おと ON/OFF" class="absolute top-2 right-2 text-slate-400 hover:text-amber-600 text-xl p-1">
                🔊
            </button>

            <!-- Question Sentence Text -->
            <div id="sentenceContainer" class="text-xl sm:text-2xl font-bold text-slate-800 leading-relaxed tracking-wider my-1">
                <!-- Dynamically populated sentence -->
            </div>

            <!-- Instruction Subtext -->
            <div id="instructionPrompt" class="text-xs sm:text-sm font-bold text-amber-600 mt-1">
                <!-- Instruction prompt -->
            </div>
        </div>

        <!-- Mode 1: Reading Mode Options Container -->
        <div id="readingModeArea" class="flex flex-col gap-3 my-auto">
            <!-- 3-Choice Narrow Helper Button -->
            <div class="flex justify-end">
                <button id="btnNarrow3" onclick="apply3ChoiceHelper()" class="bg-amber-100 hover:bg-amber-200 text-amber-800 border border-amber-300 text-xs sm:text-sm font-bold px-3 py-1.5 rounded-xl shadow-sm transition-all flex items-center gap-1.5 active:scale-95">
                    <span>💡 3択にしぼる</span>
                </button>
            </div>

            <!-- 4 Multiple-Choice Buttons -->
            <div id="optionsGrid" class="grid grid-cols-1 sm:grid-cols-2 gap-3">
                <!-- Dynamically rendered choice buttons -->
            </div>
        </div>

        <!-- Mode 2: Writing Mode Canvas Container -->
        <div id="writingModeArea" class="hidden flex-col items-center gap-3 my-auto">
            
            <!-- Canvas Toolbar Controls -->
            <div class="w-full flex justify-between items-center px-1">
                <!-- Guide Toggle Button (Default OFF) -->
                <button id="btnToggleGuide" onclick="toggleKanjiGuide()" class="bg-slate-100 hover:bg-slate-200 text-slate-700 border border-slate-300 text-xs font-bold px-3 py-1.5 rounded-xl transition flex items-center gap-1">
                    <span id="guideIcon">👀</span> <span id="guideText">お手本を表示</span>
                </button>

                <!-- Drawing Canvas Eraser Controls -->
                <div class="flex items-center gap-2">
                    <button onclick="undoCanvasStroke()" class="bg-amber-100 hover:bg-amber-200 text-amber-800 border border-amber-300 text-xs font-bold px-2.5 py-1.5 rounded-xl transition flex items-center gap-1 active:scale-95">
                        ↩️ 1つもどす
                    </button>
                    <button onclick="clearWritingCanvas()" class="bg-rose-100 hover:bg-rose-200 text-rose-700 border border-rose-300 text-xs font-bold px-2.5 py-1.5 rounded-xl transition flex items-center gap-1 active:scale-95">
                        🗑️ けす
                    </button>
                </div>
            </div>

            <!-- Genko Yoshi Handwriting Canvas Wrapper -->
            <div class="relative w-[270px] h-[270px] sm:w-[310px] sm:h-[310px] rounded-2xl border-4 border-amber-400 shadow-lg overflow-hidden genko-grid flex items-center justify-center">
                <!-- Hidden Target Kanji Guide (Default Hidden) -->
                <div id="guideKanjiOverlay" class="absolute inset-0 flex items-center justify-center text-slate-300/35 font-bold select-none pointer-events-none hidden text-[180px] sm:text-[220px] leading-none" style="font-family: 'Hiragino Sans', 'Yu Gothic', sans-serif;">
                    漢
                </div>

                <!-- Touch / Pointer Interactive Canvas -->
                <canvas id="handwritingCanvas" class="w-full h-full cursor-crosshair z-10" style="touch-action: none;"></canvas>
            </div>

            <!-- Submit & Grade Button -->
            <button onclick="submitWritingAnswer()" class="w-full max-w-xs bg-gradient-to-r from-emerald-500 to-teal-600 hover:from-emerald-600 hover:to-teal-700 text-white font-black text-lg py-3 px-6 rounded-2xl shadow-md transition-all active:scale-95 flex items-center justify-center gap-2 border-b-4 border-teal-800">
                <span>💮 さいてんする！</span>
            </button>
        </div>

        <!-- Writing Feedback & Self-Check Overlay Modal -->
        <div id="writingFeedbackModal" class="hidden fixed inset-0 bg-slate-900/60 backdrop-blur-sm z-50 flex items-center justify-center p-4">
            <div class="bg-white rounded-3xl p-5 max-w-sm w-full shadow-2xl border-4 border-amber-400 text-center animate-pop-in">
                
                <h2 id="feedbackTitle" class="text-2xl font-black text-amber-600 mb-1"></h2>
                
                <!-- Side-by-side Drawing Comparison -->
                <div class="flex items-center justify-center gap-3 my-3">
                    <div class="flex flex-col items-center">
                        <span class="text-xs font-bold text-slate-500 mb-1">あなたの字</span>
                        <div class="w-24 h-24 sm:w-28 sm:h-28 border-2 border-slate-300 rounded-xl bg-slate-50 p-1 flex items-center justify-center">
                            <img id="userCanvasSnapshot" class="max-w-full max-h-full" alt="User writing">
                        </div>
                    </div>
                    
                    <div class="text-xl font-black text-slate-400">vs</div>

                    <div class="flex flex-col items-center">
                        <span class="text-xs font-bold text-slate-500 mb-1">正しい漢字</span>
                        <div class="w-24 h-24 sm:w-28 sm:h-28 border-2 border-amber-300 rounded-xl bg-amber-50/50 flex items-center justify-center text-5xl sm:text-6xl font-bold text-slate-800">
                            <span id="correctKanjiDisplay">漢</span>
                        </div>
                    </div>
                </div>

                <!-- Match Score Badge -->
                <div class="mb-4">
                    <span class="text-xs font-bold text-slate-500">一致度（いっちど）: </span>
                    <span id="matchScoreBadge" class="text-sm font-black px-2.5 py-0.5 rounded-full bg-amber-100 text-amber-800 border border-amber-300">
                        85%
                    </span>
                </div>

                <!-- Auto Pass Action Button -->
                <div id="autoPassActions" class="hidden">
                    <p class="text-emerald-600 font-bold text-base mb-3">✨ すばらしい！大せいかい！ ✨</p>
                    <button onclick="advanceNextQuestion()" class="w-full bg-emerald-500 hover:bg-emerald-600 text-white font-bold py-3 rounded-xl shadow transition">
                        つぎの問題へ ➔
                    </button>
                </div>

                <!-- Self Check Decision Action Buttons -->
                <div id="selfCheckActions" class="hidden flex flex-col gap-2">
                    <p class="text-xs font-bold text-slate-600 mb-1">自分で たしかめてみよう！</p>
                    <div class="grid grid-cols-2 gap-2.5">
                        <button onclick="gradeWritingManual(false)" class="bg-rose-100 hover:bg-rose-200 text-rose-800 font-bold py-2.5 rounded-xl border border-rose-300 transition text-sm">
                            ❌ むずかしい
                        </button>
                        <button onclick="gradeWritingManual(true)" class="bg-emerald-500 hover:bg-emerald-600 text-white font-bold py-2.5 rounded-xl shadow transition text-sm">
                            ⭕ できた！
                        </button>
                    </div>
                </div>

            </div>
        </div>

        <!-- 10-Question Drill Completion Modal -->
        <div id="sessionSummaryModal" class="hidden fixed inset-0 bg-slate-900/70 backdrop-blur-sm z-50 flex items-center justify-center p-4">
            <div class="bg-gradient-to-b from-white to-amber-50 rounded-3xl p-6 max-w-sm w-full shadow-2xl border-4 border-amber-400 text-center animate-pop-in">
                
                <div class="text-5xl mb-2 animate-bounce-short">🎉</div>
                <h2 class="text-2xl font-black text-amber-700">10問クリア！</h2>
                <p class="text-xs font-bold text-amber-600 mb-4">よくがんばったね！ メダルをゲット！</p>

                <!-- Summary Stats Box -->
                <div class="bg-white rounded-2xl p-4 shadow-inner border border-amber-200 mb-5 flex justify-around items-center">
                    <div>
                        <div class="text-xs font-bold text-slate-500">せいかい数</div>
                        <div class="text-2xl font-black text-amber-600"><span id="summaryCorrectCount">10</span> / 10</div>
                    </div>
                    <div class="h-8 w-px bg-amber-200"></div>
                    <div>
                        <div class="text-xs font-bold text-slate-500">もらったメダル</div>
                        <div class="text-2xl font-black text-amber-500">🏅 +1</div>
                    </div>
                </div>

                <button onclick="restartSession()" class="w-full bg-gradient-to-r from-amber-500 to-orange-500 hover:from-amber-600 hover:to-orange-600 text-white font-black text-lg py-3 rounded-2xl shadow-md transition active:scale-95 border-b-4 border-orange-700">
                    もう一度ちょうせん！ 🚀
                </button>
            </div>
        </div>

    </main>

    <!-- Footer -->
    <footer class="bg-amber-100 text-amber-800/80 text-xs text-center py-2 border-t border-amber-200">
        漢字マスター！ しょうがくせいのかんじドリル &copy; 1〜3年生対応
    </footer>

    <script>
        /* ====================================================================
           1. KANJI DRILL DATABASE (Grades 1 - 3 Across Terms 1 - 3)
           ==================================================================== */
        const KANJI_DATABASE = {
            "1": [
                // Grade 1 - Term 1
                { term: 1, kanji: "一", read: "ひとつ", options: ["ひとつ", "ふたつ", "みっつ", "よっつ"], sentence: "りんごを 一つ たべる。" },
                { term: 1, kanji: "二", read: "ふたつ", options: ["ふたつ", "ひとつ", "みっつ", "いつつ"], sentence: "みかんが 二つ ある。" },
                { term: 1, kanji: "三", read: "みっつ", options: ["みっつ", "ふたつ", "よっつ", "むっつ"], sentence: "ケーキを 三つ かう。" },
                { term: 1, kanji: "木", read: "き", options: ["き", "もり", "はやし", "はな"], sentence: "大きな 木を うえる。" },
                { term: 1, kanji: "山", read: "やま", options: ["やま", "かわ", "うみ", "そら"], sentence: "たかい 山に のぼる。" },
                { term: 1, kanji: "川", read: "かわ", options: ["かわ", "やま", "うみ", "池"], sentence: "きれいな 川が ながれる。" },
                { term: 1, kanji: "日", read: "ひ", options: ["ひ", "つき", "ほし", "あさ"], sentence: "日がおちて 暗くなる。" },
                { term: 1, kanji: "月", read: "つき", options: ["つき", "ひ", "ほし", "くも"], sentence: "まんげつの 月が でる。" },
                // Grade 1 - Term 2
                { term: 2, kanji: "水", read: "みず", options: ["みず", "ひ", "つち", "かぜ"], sentence: "冷たい 水を のむ。" },
                { term: 2, kanji: "火", read: "ひ", options: ["ひ", "みず", "き", "いし"], sentence: "キャンプファイヤーの 火。" },
                { term: 2, kanji: "人", read: "ひと", options: ["ひと", "いぬ", "ねこ", "とり"], sentence: "たくさんの 人が あつまる。" },
                { term: 2, kanji: "口", read: "くち", options: ["くち", "め", "みみ", "て"], sentence: "大きな 口を あける。" },
                { term: 2, kanji: "目", read: "め", options: ["め", "みみ", "くち", "はな"], sentence: "目をとじて かんがえる。" },
                { term: 2, kanji: "手", read: "て", options: ["て", "あし", "め", "くち"], sentence: "手を あげて はつげんする。" },
                { term: 2, kanji: "犬", read: "いぬ", options: ["いぬ", "ねこ", "とり", "うま"], sentence: "かわいい 犬と さんぽする。" },
                { term: 2, kanji: "花", read: "はな", options: ["はな", "くさ", "き", "は"], sentence: "赤い 花が さいている。" },
                // Grade 1 - Term 3
                { term: 3, kanji: "赤", read: "あか", options: ["あか", "あお", "しろ", "くろ"], sentence: "赤いろの りんご。" },
                { term: 3, kanji: "青", read: "あお", options: ["あお", "あか", "きいろ", "みどり"], sentence: "青い そらが ひろがる。" },
                { term: 3, kanji: "白", read: "しろ", options: ["しろ", "くろ", "あか", "あお"], sentence: "白い くもが うかぶ。" },
                { term: 3, kanji: "車", read: "くるま", options: ["くるま", "でんしゃ", "ふね", "ひこうき"], sentence: "赤い 車に のる。" }
            ],
            "2": [
                // Grade 2 - Term 1
                { term: 1, kanji: "春", read: "はる", options: ["はる", "なつ", "あき", "ふゆ"], sentence: "暖かい 春が きた。" },
                { term: 1, kanji: "夏", read: "なつ", options: ["なつ", "はる", "あき", "ふゆ"], sentence: "暑い 夏休みが たのしみだ。" },
                { term: 1, kanji: "秋", read: "あき", options: ["あき", "はる", "なつ", "ふゆ"], sentence: "涼しい 秋の かぜ。" },
                { term: 1, kanji: "冬", read: "ふゆ", options: ["ふゆ", "はる", "なつ", "あき"], sentence: "寒い 冬に ゆきが ふる。" },
                { term: 1, kanji: "家", read: "いえ", options: ["いえ", "まち", "みせ", "がっこう"], sentence: "自分の 家に かえる。" },
                { term: 1, kanji: "友", read: "とも", options: ["とも", "ひと", "あに", "おとうと"], sentence: "大切な 友達と あそぶ。" },
                // Grade 2 - Term 2
                { term: 2, kanji: "高", read: "たか", options: ["たか", "ひく", "なが", "みじか"], sentence: "高い たてものを 見あげる。" },
                { term: 2, kanji: "広", read: "ひろ", options: ["ひろ", "せま", "たか", "ふか"], sentence: "広い こうえんで 走る。" },
                { term: 2, kanji: "歩", read: "ある", options: ["ある", "はし", "とび", "のぼ"], sentence: "ゆっくり 歩いて いこう。" },
                { term: 2, kanji: "走", read: "はし", options: ["はし", "ある", "およ", "とぶ"], sentence: "グラウンドを 走る。" },
                // Grade 2 - Term 3
                { term: 3, kanji: "風", read: "かぜ", options: ["かぜ", "あめ", "ゆき", "くも"], sentence: "強い 風が ふいている。" },
                { term: 3, kanji: "海", read: "うみ", options: ["うみ", "かわ", "みずうみ", "いけ"], sentence: "青い 海で あそぶ。" }
            ],
            "3": [
                // Grade 3 - Term 1
                { term: 1, kanji: "港", read: "みなと", options: ["みなと", "うみ", "ふね", "まち"], sentence: "船が 港に とまる。" },
                { term: 1, kanji: "旅", read: "たび", options: ["たび", "さんぽ", "ドライブ", "あそび"], sentence: "家族で 楽しい 旅に でる。" },
                { term: 1, kanji: "館", read: "かん", options: ["かん", "いえ", "みせ", "えき"], sentence: "としょ館で 本を かりる。" },
                { term: 1, kanji: "服", read: "ふく", options: ["ふく", "くつ", "ぼうし", "かばん"], sentence: "あたたかい 服を きる。" },
                // Grade 3 - Term 2
                { term: 2, kanji: "温", read: "あたた", options: ["あたた", "つめた", "あつ", "さむ"], sentence: "温かい お湯に つかる。" },
                { term: 2, kanji: "緑", read: "みどり", options: ["みどり", "あか", "あお", "きいろ"], sentence: "緑色の はっぱ。" },
                // Grade 3 - Term 3
                { term: 3, kanji: "洋", read: "よう", options: ["よう", "わ", "ちゅう", "かん"], sentence: "洋服を かいに いく。" },
                { term: 3, kanji: "命", read: "いのち", options: ["いのち", "からだ", "こころ", "ちから"], sentence: "命を 大切に しよう。" }
            ]
        };

        /* ====================================================================
           2. GLOBAL APP STATE & PERSISTENCE
           ==================================================================== */
        const STORAGE_KEY = "kanji_master_drill_v3_stats";
        let stats = {
            readStars: 0,
            readMedals: 0,
            writeStars: 0,
            writeMedals: 0
        };

        let currentQuestions = [];
        let currentQuestionIndex = 0;
        let sessionCorrectCount = 0;
        let isAudioEnabled = true;
        let isGuideKanjiVisible = false;

        // Canvas state variables
        let canvas, ctx;
        let isDrawing = false;
        let strokeHistory = [];
        let currentStroke = [];

        /* ====================================================================
           3. SOUND EFFECTS SYNTHESIS (WEB AUDIO API)
           ==================================================================== */
        const AudioContext = window.AudioContext || window.webkitAudioContext;
        let audioCtx = null;

        function playSound(type) {
            if (!isAudioEnabled) return;
            try {
                if (!audioCtx) audioCtx = new AudioContext();
                if (audioCtx.state === 'suspended') audioCtx.resume();

                const now = audioCtx.currentTime;

                if (type === 'correct') {
                    const osc1 = audioCtx.createOscillator();
                    const osc2 = audioCtx.createOscillator();
                    const gain = audioCtx.createGain();

                    osc1.type = 'sine';
                    osc2.type = 'sine';
                    osc1.frequency.setValueAtTime(523.25, now); // C5
                    osc1.frequency.setValueAtTime(659.25, now + 0.09); // E5
                    osc2.frequency.setValueAtTime(1046.50, now + 0.09); // C6

                    gain.gain.setValueAtTime(0.25, now);
                    gain.gain.exponentialRampToValueAtTime(0.001, now + 0.45);

                    osc1.connect(gain);
                    osc2.connect(gain);
                    gain.connect(audioCtx.destination);

                    osc1.start(now);
                    osc2.start(now + 0.09);
                    osc1.stop(now + 0.45);
                    osc2.stop(now + 0.45);
                } else if (type === 'wrong') {
                    const osc = audioCtx.createOscillator();
                    const gain = audioCtx.createGain();

                    osc.type = 'sawtooth';
                    osc.frequency.setValueAtTime(190, now);
                    osc.frequency.setValueAtTime(140, now + 0.12);

                    gain.gain.setValueAtTime(0.25, now);
                    gain.gain.exponentialRampToValueAtTime(0.001, now + 0.35);

                    osc.connect(gain);
                    gain.connect(audioCtx.destination);

                    osc.start(now);
                    osc.stop(now + 0.35);
                } else if (type === 'pop') {
                    const osc = audioCtx.createOscillator();
                    const gain = audioCtx.createGain();

                    osc.type = 'sine';
                    osc.frequency.setValueAtTime(450, now);
                    osc.frequency.exponentialRampToValueAtTime(850, now + 0.07);

                    gain.gain.setValueAtTime(0.2, now);
                    gain.gain.exponentialRampToValueAtTime(0.001, now + 0.07);

                    osc.connect(gain);
                    gain.connect(audioCtx.destination);

                    osc.start(now);
                    osc.stop(now + 0.07);
                }
            } catch (e) {
                console.warn("Audio playback failed:", e);
            }
        }

        function toggleAudio() {
            isAudioEnabled = !isAudioEnabled;
            document.getElementById('audioToggleBtn').innerText = isAudioEnabled ? "🔊" : "🔇";
        }

        /* ====================================================================
           4. APP LIFECYCLE & INITIALIZATION
           ==================================================================== */
        window.addEventListener('DOMContentLoaded', () => {
            loadStatsFromStorage();
            initCanvas();

            // Event listeners for dropdown filters
            document.getElementById('gradeSelect').addEventListener('change', startNewSession);
            document.getElementById('termSelect').addEventListener('change', startNewSession);
            document.getElementById('modeSelect').addEventListener('change', startNewSession);

            startNewSession();
        });

        function loadStatsFromStorage() {
            try {
                const data = localStorage.getItem(STORAGE_KEY);
                if (data) stats = Object.assign(stats, JSON.parse(data));
            } catch (e) {
                console.warn("Could not load stats from localStorage:", e);
            }
            updateStatsDisplay();
        }

        function saveStatsToStorage() {
            try {
                localStorage.setItem(STORAGE_KEY, JSON.stringify(stats));
            } catch (e) {
                console.warn("Could not save stats to localStorage:", e);
            }
            updateStatsDisplay();
        }

        function updateStatsDisplay() {
            document.getElementById('readStarsCount').innerText = stats.readStars;
            document.getElementById('readMedalsCount').innerText = stats.readMedals;
            document.getElementById('writeStarsCount').innerText = stats.writeStars;
            document.getElementById('writeMedalsCount').innerText = stats.writeMedals;
        }

        /* ====================================================================
           5. DRILL SESSION ENGINE
           ==================================================================== */
        function getQuestionPool(grade, term) {
            let pool = KANJI_DATABASE[grade] || KANJI_DATABASE["1"];

            if (term !== "all") {
                const termNum = parseInt(term, 10);
                const filtered = pool.filter(q => q.term === termNum);
                if (filtered.length > 0) pool = filtered;
            }

            return pool;
        }

        function startNewSession() {
            const grade = document.getElementById('gradeSelect').value;
            const term = document.getElementById('termSelect').value;
            const pool = getQuestionPool(grade, term);

            // Shuffle and pick 10 questions
            const shuffled = [...pool].sort(() => Math.random() - 0.5);
            currentQuestions = [];
            while (currentQuestions.length < 10) {
                currentQuestions.push(...shuffled);
            }
            currentQuestions = currentQuestions.slice(0, 10);

            currentQuestionIndex = 0;
            sessionCorrectCount = 0;

            renderCurrentQuestion();
        }

        function restartSession() {
            document.getElementById('sessionSummaryModal').classList.add('hidden');
            startNewSession();
        }

        function renderCurrentQuestion() {
            const mode = document.getElementById('modeSelect').value;
            const q = currentQuestions[currentQuestionIndex];

            // Progress bar
            document.getElementById('currentQIndex').innerText = currentQuestionIndex + 1;
            const progressPct = (currentQuestionIndex / 10) * 100;
            document.getElementById('sessionProgressBar').style.width = `${progressPct}%`;

            const sentenceContainer = document.getElementById('sentenceContainer');
            const instructionPrompt = document.getElementById('instructionPrompt');

            if (mode === 'read') {
                // READING MODE: Target Kanji highlighted in sentence. NO SPOILER HINT!
                document.getElementById('readingModeArea').classList.remove('hidden');
                document.getElementById('writingModeArea').classList.add('hidden');

                const highlightedSentence = q.sentence.replace(
                    q.kanji,
                    `<span class="text-rose-600 font-extrabold underline decoration-wavy decoration-rose-400 decoration-2 px-1 text-2xl sm:text-3xl">${q.kanji}</span>`
                );
                sentenceContainer.innerHTML = highlightedSentence;
                instructionPrompt.innerText = "赤い 漢字の「よみかた」を えらんでね！";

                renderReadingOptions(q);

            } else {
                // WRITING MODE: Replace target Kanji with hiragana reading in brackets.
                document.getElementById('readingModeArea').classList.add('hidden');
                document.getElementById('writingModeArea').classList.remove('hidden');

                const hiraganaSentence = q.sentence.replace(
                    q.kanji,
                    `<span class="bg-amber-100 text-amber-900 border-2 border-amber-400 rounded-lg px-2 py-0.5 text-2xl sm:text-3xl font-extrabold shadow-sm">【${q.read}】</span>`
                );
                sentenceContainer.innerHTML = hiraganaSentence;
                instructionPrompt.innerText = `四角の中に「${q.read}」を 漢字で 書いてね！`;

                // Set up target guide overlay
                document.getElementById('guideKanjiOverlay').innerText = q.kanji;
                clearWritingCanvas();
            }
        }

        /* ====================================================================
           6. READING MODE LOGIC & 3-CHOICE HELPER
           ==================================================================== */
        function renderReadingOptions(q) {
            const grid = document.getElementById('optionsGrid');
            grid.innerHTML = '';

            // Reset 3-Choice Button
            const btnNarrow3 = document.getElementById('btnNarrow3');
            btnNarrow3.disabled = false;
            btnNarrow3.classList.remove('opacity-50', 'cursor-not-allowed');
            btnNarrow3.innerHTML = '<span>💡 3択にしぼる</span>';

            // Options setup
            let options = q.options ? [...q.options] : [q.read];
            if (!options.includes(q.read)) options.push(q.read);

            const dummyReadings = ["ひとつ", "やま", "かわ", "あか", "あお", "しろ", "たか", "みず", "はる", "うみ"];
            while (options.length < 4) {
                const dummy = dummyReadings[Math.floor(Math.random() * dummyReadings.length)];
                if (!options.includes(dummy)) options.push(dummy);
            }
            options = options.slice(0, 4).sort(() => Math.random() - 0.5);

            options.forEach(opt => {
                const btn = document.createElement('button');
                btn.className = "option-btn bg-white hover:bg-amber-100/80 border-2 border-amber-300 text-amber-900 font-extrabold text-lg sm:text-xl py-3 px-4 rounded-2xl shadow transition-all active:scale-95 flex items-center justify-center gap-2";
                btn.dataset.read = opt;
                btn.innerText = opt;
                btn.onclick = () => handleReadingSelection(opt, q.read, btn);
                grid.appendChild(btn);
            });
        }

        function apply3ChoiceHelper() {
            const q = currentQuestions[currentQuestionIndex];
            const buttons = Array.from(document.querySelectorAll('.option-btn'));
            const wrongButtons = buttons.filter(b => b.dataset.read !== q.read && !b.disabled);

            if (wrongButtons.length > 0) {
                const btnToRemove = wrongButtons[Math.floor(Math.random() * wrongButtons.length)];
                btnToRemove.disabled = true;
                btnToRemove.classList.add('opacity-30', 'line-through', 'bg-slate-100');
                btnToRemove.classList.remove('hover:bg-amber-100/80', 'active:scale-95');

                playSound('pop');

                const btnNarrow3 = document.getElementById('btnNarrow3');
                btnNarrow3.disabled = true;
                btnNarrow3.classList.add('opacity-50', 'cursor-not-allowed');
                btnNarrow3.innerText = '3択にしました！';
            }
        }

        function handleReadingSelection(selected, correct, btnElement) {
            const allButtons = document.querySelectorAll('.option-btn');
            allButtons.forEach(b => b.disabled = true);

            if (selected === correct) {
                btnElement.classList.remove('bg-white', 'border-amber-300');
                btnElement.classList.add('bg-emerald-500', 'text-white', 'border-emerald-600', 'scale-105');
                playSound('correct');

                stats.readStars += 1;
                sessionCorrectCount += 1;
                saveStatsToStorage();

                setTimeout(() => advanceNextQuestion(), 900);
            } else {
                btnElement.classList.remove('bg-white', 'border-amber-300');
                btnElement.classList.add('bg-rose-500', 'text-white', 'border-rose-600');
                playSound('wrong');

                allButtons.forEach(b => {
                    if (b.dataset.read === correct) {
                        b.classList.add('bg-emerald-100', 'border-emerald-400', 'text-emerald-800');
                    }
                });

                setTimeout(() => advanceNextQuestion(), 1500);
            }
        }

        /* ====================================================================
           7. HANDWRITING CANVAS & POINTER EVENTS ENGINE
           ==================================================================== */
        function initCanvas() {
            canvas = document.getElementById('handwritingCanvas');
            ctx = canvas.getContext('2d');

            resizeCanvasBuffer();
            window.addEventListener('resize', resizeCanvasBuffer);

            // Pointer Events for reliable Touch, Stylus, and Mouse drawing
            canvas.addEventListener('pointerdown', handlePointerDown);
            canvas.addEventListener('pointermove', handlePointerMove);
            canvas.addEventListener('pointerup', handlePointerUp);
            canvas.addEventListener('pointercancel', handlePointerUp);
        }

        function resizeCanvasBuffer() {
            const rect = canvas.getBoundingClientRect();
            if (rect.width === 0 || rect.height === 0) return;

            // Maintain crisp 2x resolution buffer
            canvas.width = rect.width * 2;
            canvas.height = rect.height * 2;
            redrawCanvasFromHistory();
        }

        function getCanvasCoords(e) {
            const rect = canvas.getBoundingClientRect();
            const scaleX = canvas.width / rect.width;
            const scaleY = canvas.height / rect.height;
            return {
                x: (e.clientX - rect.left) * scaleX,
                y: (e.clientY - rect.top) * scaleY
            };
        }

        function handlePointerDown(e) {
            canvas.setPointerCapture(e.pointerId);
            isDrawing = true;
            const pos = getCanvasCoords(e);
            currentStroke = [pos];

            ctx.lineWidth = 20; // Internal buffer thickness
            ctx.lineCap = 'round';
            ctx.lineJoin = 'round';
            ctx.strokeStyle = '#1e293b';

            ctx.beginPath();
            ctx.moveTo(pos.x, pos.y);
            // Draw a dot immediately on pointer down
            ctx.arc(pos.x, pos.y, 0.1, 0, Math.PI * 2);
            ctx.stroke();
        }

        function handlePointerMove(e) {
            if (!isDrawing) return;
            const pos = getCanvasCoords(e);
            currentStroke.push(pos);

            ctx.beginPath();
            const lastPos = currentStroke[currentStroke.length - 2] || pos;
            ctx.moveTo(lastPos.x, lastPos.y);
            ctx.lineTo(pos.x, pos.y);
            ctx.stroke();
        }

        function handlePointerUp(e) {
            if (isDrawing) {
                isDrawing = false;
                if (currentStroke.length > 0) {
                    strokeHistory.push(currentStroke);
                    currentStroke = [];
                }
                try {
                    canvas.releasePointerCapture(e.pointerId);
                } catch (err) {}
            }
        }

        function clearWritingCanvas() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            strokeHistory = [];
            currentStroke = [];
        }

        function undoCanvasStroke() {
            if (strokeHistory.length === 0) return;
            strokeHistory.pop();
            redrawCanvasFromHistory();
        }

        function redrawCanvasFromHistory() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            ctx.lineWidth = 20;
            ctx.lineCap = 'round';
            ctx.lineJoin = 'round';
            ctx.strokeStyle = '#1e293b';

            strokeHistory.forEach(stroke => {
                if (stroke.length === 0) return;
                ctx.beginPath();
                ctx.moveTo(stroke[0].x, stroke[0].y);
                stroke.forEach(pt => ctx.lineTo(pt.x, pt.y));
                ctx.stroke();
            });
        }

        function toggleKanjiGuide() {
            isGuideKanjiVisible = !isGuideKanjiVisible;
            const overlay = document.getElementById('guideKanjiOverlay');
            const icon = document.getElementById('guideIcon');
            const text = document.getElementById('guideText');

            if (isGuideKanjiVisible) {
                overlay.classList.remove('hidden');
                icon.innerText = "🙈";
                text.innerText = "お手本をかくす";
            } else {
                overlay.classList.add('hidden');
                icon.innerText = "👀";
                text.innerText = "お手本を表示";
            }
        }

        /* ====================================================================
           8. WRITING AUTO-GRADING & PIXEL OVERLAP CALCULATION
           ==================================================================== */
        function submitWritingAnswer() {
            if (strokeHistory.length === 0) {
                playSound('wrong');
                return;
            }

            const q = currentQuestions[currentQuestionIndex];
            const score = calculateStrokeMatchScore(q.kanji);

            // Snapshot user drawing
            const userSnap = document.getElementById('userCanvasSnapshot');
            userSnap.src = canvas.toDataURL();

            document.getElementById('correctKanjiDisplay').innerText = q.kanji;
            document.getElementById('matchScoreBadge').innerText = `${score}%`;

            const modal = document.getElementById('writingFeedbackModal');
            const title = document.getElementById('feedbackTitle');
            const autoPassActions = document.getElementById('autoPassActions');
            const selfCheckActions = document.getElementById('selfCheckActions');

            if (score >= 80) {
                // 80%+ Auto Pass
                playSound('correct');
                title.innerText = "💮 たいへん よくできました！";
                autoPassActions.classList.remove('hidden');
                selfCheckActions.classList.add('hidden');

                stats.writeStars += 1;
                sessionCorrectCount += 1;
                saveStatsToStorage();
            } else {
                // Below 80%: Self-Check Mode
                playSound('wrong');
                title.innerText = "かたちの確認（かくにん）";
                autoPassActions.classList.add('hidden');
                selfCheckActions.classList.remove('hidden');
            }

            modal.classList.remove('hidden');
        }

        function calculateStrokeMatchScore(targetKanji) {
            // Offscreen target canvas
            const offCanvas = document.createElement('canvas');
            offCanvas.width = 160;
            offCanvas.height = 160;
            const offCtx = offCanvas.getContext('2d');

            offCtx.fillStyle = '#ffffff';
            offCtx.fillRect(0, 0, 160, 160);
            offCtx.fillStyle = '#000000';
            offCtx.font = "bold 120px 'Hiragino Sans', 'Yu Gothic', sans-serif";
            offCtx.textAlign = 'center';
            offCtx.textBaseline = 'middle';
            offCtx.fillText(targetKanji, 80, 80);

            // Offscreen scaled user canvas
            const userCanvas = document.createElement('canvas');
            userCanvas.width = 160;
            userCanvas.height = 160;
            const uCtx = userCanvas.getContext('2d');
            uCtx.fillStyle = '#ffffff';
            uCtx.fillRect(0, 0, 160, 160);
            uCtx.drawImage(canvas, 0, 0, 160, 160);

            const targetData = offCtx.getImageData(0, 0, 160, 160).data;
            const userData = uCtx.getImageData(0, 0, 160, 160).data;

            let intersection = 0;
            let targetPixels = 0;
            let userPixels = 0;

            for (let i = 0; i < targetData.length; i += 4) {
                const isTargetDark = targetData[i] < 128;
                const isUserDark = userData[i] < 128;

                if (isTargetDark) targetPixels++;
                if (isUserDark) userPixels++;
                if (isTargetDark && isUserDark) intersection++;
            }

            if (targetPixels === 0 || userPixels === 0) return 0;

            const recall = intersection / targetPixels;
            const precision = intersection / userPixels;
            const f1 = (2 * recall * precision) / (recall + precision || 1);

            let score = Math.round(f1 * 100 * 1.3); // Tolerance scale for kids
            return Math.min(99, Math.max(25, score));
        }

        function gradeWritingManual(isCorrect) {
            document.getElementById('writingFeedbackModal').classList.add('hidden');
            if (isCorrect) {
                playSound('correct');
                stats.writeStars += 1;
                sessionCorrectCount += 1;
                saveStatsToStorage();
                advanceNextQuestion();
            } else {
                clearWritingCanvas();
            }
        }

        /* ====================================================================
           9. QUESTION ADVANCEMENT & DRILL COMPLETION
           ==================================================================== */
        function advanceNextQuestion() {
            document.getElementById('writingFeedbackModal').classList.add('hidden');
            currentQuestionIndex++;

            if (currentQuestionIndex < 10) {
                renderCurrentQuestion();
            } else {
                finishDrillSession();
            }
        }

        function finishDrillSession() {
            const mode = document.getElementById('modeSelect').value;

            if (mode === 'read') {
                stats.readMedals += 1;
            } else {
                stats.writeMedals += 1;
            }
            saveStatsToStorage();

            document.getElementById('summaryCorrectCount').innerText = sessionCorrectCount;
            document.getElementById('sessionSummaryModal').classList.remove('hidden');

            playSound('correct');
        }

        function resetToHome() {
            document.getElementById('sessionSummaryModal').classList.add('hidden');
            document.getElementById('writingFeedbackModal').classList.add('hidden');
            startNewSession();
        }
    </script>
