<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>たのしい かんじ れんしゅう（1・2ねん）</title>

  <!-- Embedded SVG Favicon -->
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='25' fill='%23ff9800'/><circle cx='50' cy='50' r='40' fill='%23fff3e0'/><text x='50' y='68' font-size='55' font-family='sans-serif' font-weight='bold' text-anchor='middle' fill='%23e65100'>文</text></svg>">

  <script src="https://cdn.tailwindcss.com"></script>
  
  <style>
    body {
      font-family: "Hiragino Kaku Gothic ProN", "メイリオ", sans-serif;
      touch-action: manipulation;
      user-select: none;
      -webkit-user-select: none;
    }

    /* Cross-hair grid helper line style for kanji practice boxes */
    .canvas-grid-bg {
      background-image: 
        linear-gradient(to right, #cbd5e1 1px, transparent 1px),
        linear-gradient(to bottom, #cbd5e1 1px, transparent 1px);
      background-size: 50% 50%;
      background-position: center;
    }

    .canvas-box {
      touch-action: none;
    }

    .active-bounce:active {
      transform: scale(0.95);
    }
  </style>
</head>
<body class="bg-amber-50 min-h-screen text-slate-800 pb-10">

  <header class="bg-amber-400 border-b-4 border-amber-500 shadow-md py-3 px-4 text-center sticky top-0 z-10">
    <div class="max-w-md mx-auto flex items-center justify-between">
      <h1 class="text-xl sm:text-2xl font-black text-amber-950 tracking-wider flex items-center gap-2">
        <span class="text-2xl sm:text-3xl">✏️</span>
        <span>かんじ れんしゅう</span>
      </h1>
      <span class="bg-amber-100 text-amber-900 text-xs font-bold px-3 py-1 rounded-full border border-amber-300">1・2ねんせい</span>
    </div>
  </header>

  <main class="max-w-md mx-auto px-4 mt-4">

    <!-- Filter & Mode Card -->
    <section class="bg-white rounded-2xl p-3 shadow-sm border-2 border-amber-200 mb-4 space-y-3">
      <!-- Mode Selection Tabs -->
      <div class="grid grid-cols-2 gap-2 p-1 bg-slate-100 rounded-xl">
        <button id="mode-reading-btn" onclick="setMode('reading')" class="py-2.5 rounded-lg font-extrabold text-sm sm:text-base transition-all duration-200 flex items-center justify-center gap-1.5 shadow-sm bg-white text-emerald-600 border border-slate-200">
          <span>📖</span>
          <span>よみ もんだい</span>
        </button>
        <button id="mode-writing-btn" onclick="setMode('writing')" class="py-2.5 rounded-lg font-extrabold text-sm sm:text-base transition-all duration-200 flex items-center justify-center gap-1.5 text-slate-600 hover:text-slate-900">
          <span>✍️</span>
          <span>かき もんだい</span>
        </button>
      </div>

      <!-- Grade Selector Dropdown -->
      <div class="flex items-center justify-between text-sm pt-1 px-1">
        <label for="grade-select" class="font-bold text-slate-600 flex items-center gap-1">
          <span>🎒 がくねん:</span>
        </label>
        <select id="grade-select" onchange="filterQuestions()" class="bg-amber-50 border-2 border-amber-300 rounded-xl font-bold text-slate-800 px-3 py-1.5 focus:outline-none focus:ring-2 focus:ring-amber-400">
          <option value="all">すべて（1・2ねん）</option>
          <option value="1">1ねんせい (80じ)</option>
          <option value="2">2ねんせい (160じ)</option>
        </select>
      </div>
    </section>

    <section class="bg-white rounded-3xl p-5 shadow-lg border-4 border-amber-200 text-center relative overflow-hidden">
      
      <!-- Badges -->
      <div class="flex justify-center items-center gap-2 mb-3">
        <span id="badge-grade" class="bg-blue-500 text-white font-bold text-xs px-3 py-1 rounded-full shadow-sm">1ねん</span>
        <span id="badge-category" class="bg-orange-500 text-white font-bold text-xs px-3 py-1 rounded-full shadow-sm">じゅくご</span>
      </div>

      <!-- Question Text -->
      <div id="question-container" class="min-h-[70px] flex items-center justify-center mb-4">
        <p id="question-text" class="text-xl sm:text-2xl font-black text-slate-800 leading-relaxed"></p>
      </div>

      <!-- READ MODE UI -->
      <div id="reading-ui" class="grid grid-cols-2 gap-3 my-2">
        <!-- Choices injected dynamically -->
      </div>

      <!-- WRITE MODE UI -->
      <div id="writing-ui" class="hidden">
        <!-- Canvas grid dynamically updated based on answer length -->
        <div id="canvases-wrapper" class="flex justify-center items-center gap-3 my-4 flex-wrap">
          <!-- Canvas elements dynamically inserted -->
        </div>

        <!-- Controls for Canvas -->
        <div class="flex justify-center gap-3 mb-4">
          <button onclick="clearAllCanvases()" class="active-bounce bg-slate-200 hover:bg-slate-300 text-slate-700 font-bold px-4 py-2.5 rounded-xl text-sm flex items-center gap-1">
            <span>🗑️</span>
            <span>ぜんぶ けす</span>
          </button>
          <button onclick="showAnswer()" class="active-bounce bg-cyan-500 hover:bg-cyan-600 text-white font-bold px-5 py-2.5 rounded-xl text-sm shadow-md flex items-center gap-1">
            <span>🔍</span>
            <span>こたえあわせ</span>
          </button>
        </div>

        <!-- Answer Reveal Box -->
        <div id="answer-box" class="hidden bg-amber-50 border-2 border-dashed border-amber-400 rounded-2xl p-3 my-3">
          <p class="text-xs font-bold text-amber-700 mb-1">せいかい：</p>
          <p id="answer-kanji" class="text-4xl sm:text-5xl font-black text-red-500 tracking-widest"></p>
        </div>
      </div>

      <!-- Result Feedback -->
      <div id="result-feedback" class="min-h-[36px] flex items-center justify-center font-black text-xl mt-2"></div>

      <!-- Next Question Button -->
      <div class="mt-4">
        <button id="next-btn" onclick="nextQuestion()" class="hidden active-bounce w-full bg-pink-500 hover:bg-pink-600 text-white font-black py-3.5 px-6 rounded-2xl text-lg shadow-lg border-b-4 border-pink-700 tracking-wider">
          つぎへ すすむ ➔
        </button>
      </div>

    </section>

  </main>

  <script>
    // Audio synthesizer using Web Audio API (No external assets required)
    const audioCtx = new (window.AudioContext || window.webkitAudioContext)();

    function playSound(type) {
      if (audioCtx.state === 'suspended') {
        audioCtx.resume();
      }
      const now = audioCtx.currentTime;

      if (type === 'correct') {
        // High pitched pleasant chime (G5 -> C6)
        const osc1 = audioCtx.createOscillator();
        const gain1 = audioCtx.createGain();
        osc1.type = 'sine';
        osc1.frequency.setValueAtTime(783.99, now); // G5
        osc1.frequency.setValueAtTime(1046.50, now + 0.12); // C6
        gain1.gain.setValueAtTime(0.3, now);
        gain1.gain.exponentialRampToValueAtTime(0.001, now + 0.4);
        osc1.connect(gain1);
        gain1.connect(audioCtx.destination);
        osc1.start(now);
        osc1.stop(now + 0.4);
      } else if (type === 'fanfare') {
        // Achievement chime (C5 -> E5 -> G5 -> C6)
        [523.25, 659.25, 783.99, 1046.50].forEach((freq, idx) => {
          const osc = audioCtx.createOscillator();
          const gain = audioCtx.createGain();
          osc.type = 'triangle';
          osc.frequency.setValueAtTime(freq, now + idx * 0.08);
          gain.gain.setValueAtTime(0.25, now + idx * 0.08);
          gain.gain.exponentialRampToValueAtTime(0.001, now + idx * 0.08 + 0.3);
          osc.connect(gain);
          gain.connect(audioCtx.destination);
          osc.start(now + idx * 0.08);
          osc.stop(now + idx * 0.08 + 0.3);
        });
      } else if (type === 'wrong') {
        // Soft low tone
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = 'sawtooth';
        osc.frequency.setValueAtTime(220, now);
        osc.frequency.setValueAtTime(180, now + 0.15);
        gain.gain.setValueAtTime(0.2, now);
        gain.gain.exponentialRampToValueAtTime(0.001, now + 0.35);
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start(now);
        osc.stop(now + 0.35);
      }
    }

    // Master Questions Dataset for Grade 1 and 2
    const masterQuestions = [
      // === 1年生 (Grade 1) ===
      { id: 1, grade: 1, category: "かんじ", mode: "reading", question: "「山」の よみかたは？", options: ["やま", "かわ", "た", "うみ"], answer: "やま" },
      { id: 2, grade: 1, category: "こゆうめいし", mode: "writing", question: "「ふじ山」の 「さん」を かこう！", answer: "山" },
      { id: 3, grade: 1, category: "じゅくご", mode: "reading", question: "「火山」の よみかたは？", options: ["かざん", "かわやま", "ひやま", "かぜ"], answer: "かざん" },
      { id: 4, grade: 1, category: "こゆうめいし", mode: "writing", question: "「小川さん」の 「おがわ」を かこう！", answer: "小川" },
      { id: 5, grade: 1, category: "じゅくご", mode: "reading", question: "「水田」の よみかたは？", options: ["すいでん", "みずた", "みずいで", "すいた"], answer: "すいでん" },
      // FIXED 'たいよう' QUESTION
      { id: 6, grade: 1, category: "じゅくご", mode: "writing", question: "「たいよう」を かんじで かこう！", answer: "太陽" },
      { id: 7, grade: 1, category: "かんじ", mode: "reading", question: "「青」の よみかたは？", options: ["あお", "あか", "しろ", "くろ"], answer: "あお" },
      { id: 8, grade: 1, category: "じゅくご", mode: "writing", question: "「あおぞら」を かんじで かこう！", answer: "青空" },
      { id: 9, grade: 1, category: "じゅくご", mode: "writing", question: "「たいのう」ではなく「大こう」！「おおきい」を かこう！", answer: "大" },

      // === 2年生 (Grade 2) ===
      { id: 101, grade: 2, category: "かんじ", mode: "reading", question: "「角」の よみかたは？", options: ["つの", "かど", "くも", "かぜ"], answer: "つの" },
      { id: 102, grade: 2, category: "じゅくご", mode: "writing", question: "「もじ」を かんじで かこう！", answer: "文字" },
      { id: 103, grade: 2, category: "こゆうめいし", mode: "reading", question: "「東京都」の よみかたは？", options: ["とうきょうと", "ひがし", "みやこ", "きょう"], answer: "とうきょうと" },
      { id: 104, grade: 2, category: "じゅくご", mode: "writing", question: "「しんごう」を かんじで かこう！", answer: "信号" },
      { id: 105, grade: 2, category: "じゅくご", mode: "reading", question: "「時計」の よみかたは？", options: ["とけい", "じけい", "ときけい", "とけ"], answer: "とけい" },
      { id: 106, grade: 2, category: "こゆうめいし", mode: "writing", question: "「ほっかいどう」の 「ほっかい」を かこう！", answer: "北海" },
      { id: 107, grade: 2, category: "じゅくご", mode: "reading", question: "「算数」の よみかたは？", options: ["さんすう", "かんすう", "さんかず", "そろばん"], answer: "さんすう" },
      { id: 108, grade: 2, category: "じゅくご", mode: "writing", question: "「がいこく」を かんじで かこう！", answer: "外国" }
    ];

    // Application State Variables
    let currentMode = "reading"; // "reading" or "writing"
    let currentGrade = "all";    // "all", "1", "2"
    let filteredQuestions = [];
    let currentIndex = 0;
    let canvasObjects = [];

    // Initialization
    window.onload = () => {
      filterQuestions();
    };

    function setMode(mode) {
      if (currentMode === mode) return;
      currentMode = mode;

      const readBtn = document.getElementById("mode-reading-btn");
      const writeBtn = document.getElementById("mode-writing-btn");

      if (mode === "reading") {
        readBtn.className = "py-2.5 rounded-lg font-extrabold text-sm sm:text-base transition-all duration-200 flex items-center justify-center gap-1.5 shadow-sm bg-white text-emerald-600 border border-slate-200";
        writeBtn.className = "py-2.5 rounded-lg font-extrabold text-sm sm:text-base transition-all duration-200 flex items-center justify-center gap-1.5 text-slate-600 hover:text-slate-900";
      } else {
        writeBtn.className = "py-2.5 rounded-lg font-extrabold text-sm sm:text-base transition-all duration-200 flex items-center justify-center gap-1.5 shadow-sm bg-white text-indigo-600 border border-slate-200";
        readBtn.className = "py-2.5 rounded-lg font-extrabold text-sm sm:text-base transition-all duration-200 flex items-center justify-center gap-1.5 text-slate-600 hover:text-slate-900";
      }

      filterQuestions();
    }

    function filterQuestions() {
      currentGrade = document.getElementById("grade-select").value;
      
      filteredQuestions = masterQuestions.filter(q => {
        const matchesMode = (q.mode === currentMode);
        const matchesGrade = (currentGrade === "all" || q.grade === parseInt(currentGrade));
        return matchesMode && matchesGrade;
      });

      currentIndex = 0;
      loadQuestion();
    }

    function loadQuestion() {
      const resultDiv = document.getElementById("result-feedback");
      const nextBtn = document.getElementById("next-btn");
      resultDiv.innerText = "";
      nextBtn.classList.add("hidden");

      if (filteredQuestions.length === 0) {
        document.getElementById("question-text").innerText = "もんだいが ありません";
        document.getElementById("reading-ui").innerHTML = "";
        document.getElementById("writing-ui").classList.add("hidden");
        return;
      }

      const q = filteredQuestions[currentIndex];

      // Update Header Badges
      document.getElementById("badge-grade").innerText = `${q.grade}ねん`;
      document.getElementById("badge-category").innerText = q.category;
      document.getElementById("question-text").innerText = q.question;

      if (currentMode === "reading") {
        document.getElementById("reading-ui").classList.remove("hidden");
        document.getElementById("writing-ui").classList.add("hidden");
        renderReadingOptions(q);
      } else {
        document.getElementById("reading-ui").classList.add("hidden");
        document.getElementById("writing-ui").classList.remove("hidden");
        document.getElementById("answer-box").classList.add("hidden");
        document.getElementById("answer-kanji").innerText = q.answer;
        setupWritingCanvases(q.answer);
      }
    }

    function renderReadingOptions(q) {
      const container = document.getElementById("reading-ui");
      container.innerHTML = "";

      q.options.forEach(opt => {
        const btn = document.createElement("button");
        btn.className = "active-bounce bg-emerald-500 hover:bg-emerald-600 text-white font-extrabold text-lg sm:text-xl py-3 px-2 rounded-2xl shadow-md border-b-4 border-emerald-700 transition-colors";
        btn.innerText = opt;
        btn.onclick = () => checkReadingAnswer(opt, q.answer);
        container.appendChild(btn);
      });
    }

    function checkReadingAnswer(selected, correct) {
      const resultDiv = document.getElementById("result-feedback");
      if (selected === correct) {
        playSound('correct');
        resultDiv.className = "min-h-[36px] flex items-center justify-center font-black text-xl mt-2 text-emerald-600";
        resultDiv.innerText = "⭕ せいかい！ すごいね！";
        document.getElementById("next-btn").classList.remove("hidden");
      } else {
        playSound('wrong');
        resultDiv.className = "min-h-[36px] flex items-center justify-center font-black text-xl mt-2 text-red-500";
        resultDiv.innerText = "❌ おしい！ もう一度えらぼう";
      }
    }

    function setupWritingCanvases(answerKanji) {
      const wrapper = document.getElementById("canvases-wrapper");
      wrapper.innerHTML = "";
      canvasObjects = [];

      const charCount = answerKanji.length; // e.g., "太陽" -> 2 characters -> 2 canvas boxes
      const canvasSize = charCount === 1 ? 200 : (charCount === 2 ? 140 : 110);

      for (let i = 0; i < charCount; i++) {
        const box = document.createElement("div");
        box.className = "flex flex-col items-center gap-1";

        const canvasEl = document.createElement("canvas");
        canvasEl.width = canvasSize;
        canvasEl.height = canvasSize;
        canvasEl.className = "border-4 border-amber-300 rounded-2xl bg-white shadow-inner canvas-grid-bg cursor-crosshair canvas-box";

        const singleClearBtn = document.createElement("button");
        singleClearBtn.className = "text-xs font-bold text-slate-500 hover:text-red-500 py-1 px-2 rounded bg-slate-100";
        singleClearBtn.innerText = `けす (${i + 1})`;
        singleClearBtn.onclick = () => clearSingleCanvas(i);

        box.appendChild(canvasEl);
        if (charCount > 1) box.appendChild(singleClearBtn);
        wrapper.appendChild(box);

        const ctx = canvasEl.getContext("2d");
        ctx.lineWidth = charCount === 1 ? 12 : 9;
        ctx.lineCap = "round";
        ctx.lineJoin = "round";
        ctx.strokeStyle = "#1e293b";

        const obj = { el: canvasEl, ctx: ctx, isDrawing: false };
        canvasObjects.push(obj);

        attachDrawingEvents(obj);
      }
    }

    function attachDrawingEvents(obj) {
      const { el, ctx } = obj;

      const getPos = (e) => {
        const rect = el.getBoundingClientRect();
        const clientX = e.touches ? e.touches[0].clientX : e.clientX;
        const clientY = e.touches ? e.touches[0].clientY : e.clientY;
        return {
          x: clientX - rect.left,
          y: clientY - rect.top
        };
      };

      const startDrawing = (e) => {
        obj.isDrawing = true;
        const pos = getPos(e);
        ctx.beginPath();
        ctx.moveTo(pos.x, pos.y);
      };

      const draw = (e) => {
        if (!obj.isDrawing) return;
        const pos = getPos(e);
        ctx.lineTo(pos.x, pos.y);
        ctx.stroke();
      };

      const stopDrawing = () => {
        obj.isDrawing = false;
        ctx.beginPath();
      };

      // Mouse Input
      el.addEventListener("mousedown", startDrawing);
      el.addEventListener("mousemove", draw);
      el.addEventListener("mouseup", stopDrawing);
      el.addEventListener("mouseleave", stopDrawing);

      // Touch Input
      el.addEventListener("touchstart", (e) => { e.preventDefault(); startDrawing(e); });
      el.addEventListener("touchmove", (e) => { e.preventDefault(); draw(e); });
      el.addEventListener("touchend", stopDrawing);
    }

    function clearSingleCanvas(index) {
      if (canvasObjects[index]) {
        const { el, ctx } = canvasObjects[index];
        ctx.clearRect(0, 0, el.width, el.height);
      }
    }

    function clearAllCanvases() {
      canvasObjects.forEach(obj => {
        obj.ctx.clearRect(0, 0, obj.el.width, obj.el.height);
      });
    }

    function showAnswer() {
      playSound('fanfare');
      document.getElementById("answer-box").classList.remove("hidden");
      document.getElementById("next-btn").classList.remove("hidden");
      const resultDiv = document.getElementById("result-feedback");
      resultDiv.className = "min-h-[36px] flex items-center justify-center font-black text-xl mt-2 text-indigo-600";
      resultDiv.innerText = "じぶんで たしかめて みよう！";
    }

    function nextQuestion() {
      currentIndex = (currentIndex + 1) % filteredQuestions.length;
      loadQuestion();
    }
  </script>
</body>
</html>
