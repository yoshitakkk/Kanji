<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>1ねんせいの かんじ れんしゅう</title>
  
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><rect width=%22100%22 height=%22100%22 rx=%2220%22 fill=%22%23ff9800%22/><text y=%2270%22 x=%2210%22 font-size=%2275%22 fill=%22white%22 font-family=%22sans-serif%22 font-weight=%22bold%22>漢</text></svg>">

  <style>
    * { box-sizing: border-box; }
    body {
      font-family: "Hiragino Kaku Gothic ProN", "メイリオ", sans-serif;
      background-color: #eef7ff;
      margin: 0;
      padding: 15px;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
    }
    h1 {
      color: #2c3e50;
      font-size: 20px;
      margin: 0 0 12px 0;
      text-align: center;
    }
    
    .config-panel {
      background: white;
      padding: 10px 14px;
      border-radius: 12px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.08);
      width: 100%;
      max-width: 440px;
      margin-bottom: 12px;
      display: flex;
      flex-wrap: wrap;
      justify-content: space-around;
      gap: 8px;
      align-items: center;
    }
    .config-group {
      display: flex;
      align-items: center;
      gap: 4px;
      font-size: 13px;
      font-weight: bold;
      color: #333;
    }
    select {
      font-size: 13px;
      padding: 5px 8px;
      border-radius: 8px;
      border: 2px solid #4caf50;
      background-color: #f9f9f9;
      font-weight: bold;
      cursor: pointer;
    }

    .card {
      background: white;
      border-radius: 20px;
      padding: 20px;
      box-shadow: 0 6px 18px rgba(0,0,0,0.1);
      width: 100%;
      max-width: 440px;
      text-align: center;
    }

    .badge-container {
      display: flex;
      justify-content: center;
      gap: 6px;
      margin-bottom: 10px;
    }
    .badge {
      font-size: 12px;
      padding: 3px 10px;
      border-radius: 10px;
      color: white;
      font-weight: bold;
    }
    .badge-term { background-color: #00bcd4; }
    .badge-mode { background-color: #9c27b0; }
    .badge-type { background-color: #ff9800; }

    .question-text {
      font-size: 19px;
      margin: 8px 0 16px;
      color: #2c3e50;
      font-weight: bold;
      min-height: 52px;
      display: flex;
      align-items: center;
      justify-content: center;
      line-height: 1.4;
    }

    .options-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      margin-bottom: 12px;
    }
    .option-btn {
      background-color: #4caf50;
      color: white;
      border: none;
      padding: 14px;
      font-size: 18px;
      border-radius: 12px;
      cursor: pointer;
      font-weight: bold;
      box-shadow: 0 4px 0 #388e3c;
      transition: all 0.1s;
    }
    .option-btn:active {
      transform: translateY(4px);
      box-shadow: 0 0 0 #388e3c;
    }

    .canvas-flex-container {
      display: flex;
      justify-content: center;
      gap: 10px;
      margin-bottom: 12px;
      flex-wrap: wrap;
    }
    .canvas-wrapper {
      position: relative;
      width: 140px;
      height: 140px;
    }
    canvas {
      border: 3px solid #ffb74d;
      border-radius: 12px;
      background-color: #fffde7;
      touch-action: none;
      cursor: crosshair;
    }
    .canvas-guide {
      position: absolute;
      top: 0; left: 0;
      width: 140px; height: 140px;
      pointer-events: none;
    }
    .canvas-guide::before {
      content: '';
      position: absolute;
      top: 50%; left: 0; right: 0;
      border-top: 1px dashed #ffd54f;
    }
    .canvas-guide::after {
      content: '';
      position: absolute;
      left: 50%; top: 0; bottom: 0;
      border-left: 1px dashed #ffd54f;
    }

    .controls {
      display: flex;
      gap: 8px;
      margin-bottom: 12px;
    }
    .btn {
      flex: 1;
      padding: 10px;
      border: none;
      border-radius: 10px;
      font-size: 14px;
      cursor: pointer;
      font-weight: bold;
      box-shadow: 0 3px 0 rgba(0,0,0,0.15);
    }
    .btn:active {
      transform: translateY(3px);
      box-shadow: none;
    }
    .btn-clear { background-color: #888; color: white; }
    .btn-show { background-color: #0288d1; color: white; }
    .btn-next {
      background-color: #e91e63;
      color: white;
      padding: 12px 24px;
      font-size: 17px;
      border-radius: 25px;
      width: 100%;
    }

    .answer-box {
      background-color: #e8f5e9;
      border: 2px dashed #4caf50;
      border-radius: 12px;
      padding: 10px;
      margin-top: 8px;
      display: none;
    }
    .answer-kanji {
      font-size: 42px;
      color: #2e7d32;
      font-weight: bold;
      letter-spacing: 4px;
      margin-top: 2px;
    }

    .result-msg {
      font-size: 20px;
      font-weight: bold;
      margin: 8px 0;
      min-height: 28px;
    }
  </style>
</head>
<body>

  <h1>小学1ねんせい 漢字ドリル</h1>

  <div class="config-panel">
    <div class="config-group">
      はんい:
      <select id="term-select" onchange="filterQuestions()">
        <option value="all">すべて（全80字）</option>
        <option value="1">1がっき（かんたん）</option>
        <option value="2">2がっき（ふつう）</option>
        <option value="3">3学期（むずかしい）</option>
      </select>
    </div>
    <div class="config-group">
      モード:
      <select id="mode-select" onchange="filterQuestions()">
        <option value="reading">読みもんだい</option>
        <option value="writing">書きもんだい</option>
      </select>
    </div>
  </div>

  <div class="card">
    <div class="badge-container">
      <span id="badge-term" class="badge badge-term">全学期</span>
      <span id="badge-mode" class="badge badge-mode">読み</span>
      <span id="badge-type" class="badge badge-type">単字</span>
    </div>

    <div id="question" class="question-text">もんだいを よみこんでいます...</div>

    <div id="reading-ui" class="options-grid"></div>

    <div id="writing-ui" style="display: none;">
      <div id="canvas-container" class="canvas-flex-container"></div>
      <div class="controls">
        <button class="btn btn-clear" onclick="clearAllCanvases()">けす</button>
        <button class="btn btn-show" onclick="showWritingAnswer()">こたえあわせ</button>
      </div>
      <div id="answer-box" class="answer-box">
        <div style="font-size: 13px; color: #555;">せいかい：</div>
        <div id="answer-kanji" class="answer-kanji">山</div>
      </div>
    </div>

    <div id="result" class="result-msg"></div>

    <div id="next-container" style="display: none; margin-top: 12px;">
      <button class="btn btn-next" onclick="nextQuestion()">つぎへ ➔</button>
    </div>
  </div>

  <script>
    let masterQuestions = [];
    let currentPool = [];
    let currentIndex = 0;
    let activeCanvases = [];

    const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    function playSound(type) {
      if (audioCtx.state === 'suspended') audioCtx.resume();
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.connect(gain);
      gain.connect(audioCtx.destination);

      if (type === 'correct') {
        osc.type = 'sine';
        osc.frequency.setValueAtTime(523.25, audioCtx.currentTime);
        osc.frequency.setValueAtTime(659.25, audioCtx.currentTime + 0.1);
        gain.gain.setValueAtTime(0.3, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.3);
        osc.start();
        osc.stop(audioCtx.currentTime + 0.3);
      } else if (type === 'wrong') {
        osc.type = 'square';
        osc.frequency.setValueAtTime(200, audioCtx.currentTime);
        gain.gain.setValueAtTime(0.2, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.25);
        osc.start();
        osc.stop(audioCtx.currentTime + 0.25);
      }
    }

    function shuffleArray(array) {
      for (let i = array.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [array[i], array[j]] = [array[j], array[i]];
      }
    }

    // 外部JSONの読み込み
    window.onload = () => {
      fetch('questions_1nen.json')
        .then(response => {
          if (!response.ok) {
            throw new Error('JSONの読み込みに失敗しました');
          }
          return response.json();
        })
        .then(data => {
          masterQuestions = data;
          filterQuestions();
        })
        .catch(error => {
          console.error(error);
          document.getElementById("question").innerText = "データのよみこみに しっぱいしました";
        });
    };

    function filterQuestions() {
      const selectedTerm = document.getElementById("term-select").value;
      const selectedMode = document.getElementById("mode-select").value;

      currentPool = masterQuestions.filter(q => {
        const matchTerm = (selectedTerm === "all" || q.term === parseInt(selectedTerm));
        const matchMode = (q.mode === selectedMode);
        return matchTerm && matchMode;
      });

      shuffleArray(currentPool);
      currentIndex = 0;
      loadQuestion();
    }

    function loadQuestion() {
      const resultDiv = document.getElementById("result");
      const nextContainer = document.getElementById("next-container");
      resultDiv.innerText = "";
      nextContainer.style.display = "none";

      if (currentPool.length === 0) {
        document.getElementById("question").innerText = "条件に合う問題がありません";
        document.getElementById("reading-ui").style.display = "none";
        document.getElementById("writing-ui").style.display = "none";
        return;
      }

      const q = currentPool[currentIndex];

      const termText = q.term === 1 ? "1がっき" : q.term === 2 ? "2がっき" : "3がっき";
      document.getElementById("badge-term").innerText = termText;
      document.getElementById("badge-mode").innerText = q.mode === "reading" ? "読み" : "書き";
      document.getElementById("badge-type").innerText = q.category;
      document.getElementById("question").innerText = q.question;

      if (q.mode === "reading") {
        document.getElementById("reading-ui").style.display = "grid";
        document.getElementById("writing-ui").style.display = "none";
        renderReadingOptions(q);
      } else {
        document.getElementById("reading-ui").style.display = "none";
        document.getElementById("writing-ui").style.display = "block";
        document.getElementById("answer-box").style.display = "none";
        document.getElementById("answer-kanji").innerText = q.answer;
        setupWritingCanvases(q.answer.length);
      }
    }

    function renderReadingOptions(q) {
      const container = document.getElementById("reading-ui");
      container.innerHTML = "";
      
      const opts = [...q.options];
      shuffleArray(opts);

      opts.forEach(opt => {
        const btn = document.createElement("button");
        btn.className = "option-btn";
        btn.innerText = opt;
        btn.onclick = () => checkReadingAnswer(opt, q.answer);
        container.appendChild(btn);
      });
    }

    function checkReadingAnswer(selected, correct) {
      const resultDiv = document.getElementById("result");
      if (selected === correct) {
        playSound('correct');
        resultDiv.style.color = "#4caf50";
        resultDiv.innerText = "⭕ せいかい！";
        document.getElementById("next-container").style.display = "block";
      } else {
        playSound('wrong');
        resultDiv.style.color = "#f44336";
        resultDiv.innerText = "❌ おしい！もういちど";
      }
    }

    function setupWritingCanvases(charCount) {
      const container = document.getElementById("canvas-container");
      container.innerHTML = "";
      activeCanvases = [];

      for (let i = 0; i < charCount; i++) {
        const wrapper = document.createElement("div");
        wrapper.className = "canvas-wrapper";

        const guide = document.createElement("div");
        guide.className = "canvas-guide";

        const canvas = document.createElement("canvas");
        canvas.width = 140;
        canvas.height = 140;

        wrapper.appendChild(guide);
        wrapper.appendChild(canvas);
        container.appendChild(wrapper);

        const ctx = canvas.getContext("2d");
        initCanvasDrawing(canvas, ctx);
        activeCanvases.push({ canvas, ctx });
      }
    }

    function initCanvasDrawing(canvas, ctx) {
      ctx.lineWidth = 8;
      ctx.lineCap = "round";
      ctx.strokeStyle = "#2c3e50";
      let isDrawing = false;

      const getPos = (e) => {
        const rect = canvas.getBoundingClientRect();
        const clientX = e.touches ? e.touches[0].clientX : e.clientX;
        const clientY = e.touches ? e.touches[0].clientY : e.clientY;
        return { x: clientX - rect.left, y: clientY - rect.top };
      };

      const start = (e) => {
        isDrawing = true;
        const pos = getPos(e);
        ctx.beginPath();
        ctx.moveTo(pos.x, pos.y);
      };

      const draw = (e) => {
        if (!isDrawing) return;
        const pos = getPos(e);
        ctx.lineTo(pos.x, pos.y);
        ctx.stroke();
      };

      const stop = () => { isDrawing = false; };

      canvas.addEventListener("mousedown", start);
      canvas.addEventListener("mousemove", draw);
      canvas.addEventListener("mouseup", stop);

      canvas.addEventListener("touchstart", (e) => { e.preventDefault(); start(e); });
      canvas.addEventListener("touchmove", (e) => { e.preventDefault(); draw(e); });
      canvas.addEventListener("touchend", stop);
    }

    function clearAllCanvases() {
      activeCanvases.forEach(({ canvas, ctx }) => {
        ctx.clearRect(0, 0, canvas.width, canvas.height);
      });
    }

    function showWritingAnswer() {
      playSound('correct');
      document.getElementById("answer-box").style.display = "block";
      document.getElementById("next-container").style.display = "block";
    }

    function nextQuestion() {
      currentIndex = (currentIndex + 1) % currentPool.length;
      loadQuestion();
    }
  </script>
</body>
</html>
