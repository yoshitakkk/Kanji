<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>漢字マスター！しょうがくせいのかんじドリル</title>
    <!-- Tailwind CSS for utility styling -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome icons for buttons and UI elements -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Tone.js for clean sound effects -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/tone/14.8.49/Tone.js"></script>
    <!-- Canvas Confetti for celebrate animations -->
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@400;700;800;900&display=swap');
        
        body {
            font-family: 'M PLUS Rounded 1c', sans-serif;
            background-color: #f0f9ff;
            user-select: none;
            -webkit-user-select: none;
        }

        /* Custom scrollbar */
        ::-webkit-scrollbar {
            width: 8px;
        }
        ::-webkit-scrollbar-track {
            background: #e0f2fe;
        }
        ::-webkit-scrollbar-thumb {
            background: #38bdf8;
            border-radius: 4px;
        }

        /* Custom animation effects */
        .pop-hover {
            transition: all 0.2s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }
        .pop-hover:hover {
            transform: translateY(-3px) scale(1.02);
        }
        .pop-hover:active {
            transform: translateY(1px) scale(0.98);
        }

        .highlight-kanji {
            color: #0284c7;
            background-color: #e0f2fe;
            padding: 0.1em 0.3em;
            border-radius: 0.3rem;
            border-bottom: 3px solid #0284c7;
            font-weight: 800;
        }

        .highlight-hiragana {
            color: #d97706;
            background-color: #fef3c7;
            padding: 0.1em 0.3em;
            border-radius: 0.3rem;
            border-bottom: 3px solid #d97706;
            font-weight: 800;
        }

        .canvas-container {
            touch-action: none;
        }

        /* Target hint animation */
        @keyframes pulse-ring {
            0% { transform: scale(0.95); opacity: 0.8; }
            50% { transform: scale(1.05); opacity: 1; }
            100% { transform: scale(0.95); opacity: 0.8; }
        }
        .pulse-target {
            animation: pulse-ring 2s infinite ease-in-out;
        }
    </style>
</head>
<body class="min-h-screen text-slate-800 flex flex-col justify-between">

    <!-- Top Header & Navigation Container -->
    <header class="bg-amber-400 border-b-4 border-amber-500 shadow-md sticky top-0 z-30">
        <div class="max-w-4xl mx-auto px-4 py-2 flex flex-wrap items-center justify-between gap-2">
            <!-- Logo & Title -->
            <div class="flex items-center space-x-2">
                <div class="bg-white p-2 rounded-2xl shadow-inner text-amber-500 font-extrabold text-xl">
                    <i class="fa-solid fa-pencil"></i>
                </div>
                <div>
                    <h1 class="text-xl md:text-2xl font-black text-amber-950 tracking-wider">漢字マスター！</h1>
                    <p class="text-xs font-bold text-amber-800">しょうがくせいのかんじドリル</p>
                </div>
            </div>

            <!-- Grade, Term & Mode Controls -->
            <div class="flex flex-wrap items-center gap-2 text-sm font-bold">
                <!-- Grade Select -->
                <select id="gradeSelect" onchange="changeFilter()" class="bg-white text-slate-700 px-3 py-1.5 rounded-xl border-2 border-amber-300 shadow-sm focus:outline-none focus:ring-2 focus:ring-amber-500 cursor-pointer">
                    <option value="1">1年生 (80字)</option>
                    <option value="2">2年生 (160字)</option>
                    <option value="3">3年生 (200字)</option>
                </select>

                <!-- Term Select -->
                <select id="termSelect" onchange="changeFilter()" class="bg-white text-slate-700 px-3 py-1.5 rounded-xl border-2 border-amber-300 shadow-sm focus:outline-none focus:ring-2 focus:ring-amber-500 cursor-pointer">
                    <option value="0">すべての学期</option>
                    <option value="1">1学期</option>
                    <option value="2">2学期</option>
                    <option value="3">3学期</option>
                </select>

                <!-- Mode Select Toggle Button -->
                <div class="flex bg-amber-200 p-1 rounded-xl border border-amber-300">
                    <button id="btnYomiMode" onclick="setMode('yomi')" class="px-3 py-1 rounded-lg text-xs md:text-sm font-black transition-all bg-amber-500 text-white shadow-sm">
                        📖 よみ
                    </button>
                    <button id="btnKakiMode" onclick="setMode('kaki')" class="px-3 py-1 rounded-lg text-xs md:text-sm font-black transition-all text-amber-900 hover:bg-amber-300">
                        ✍️ かき
                    </button>
                </div>

                <!-- Open Progress Modal Button -->
                <button onclick="openProgressModal()" class="bg-white text-sky-600 hover:bg-sky-50 px-3 py-1.5 rounded-xl border-2 border-sky-300 shadow-sm flex items-center space-x-1 pop-hover">
                    <i class="fa-solid fa-trophy text-amber-500"></i>
                    <span>ずかん</span>
                </button>
            </div>
        </div>
    </header>

    <!-- Main App Container -->
    <main class="max-w-3xl w-full mx-auto p-4 flex-1 flex flex-col justify-center items-center">
        
        <!-- Score & Progress Bar -->
        <div class="w-full bg-white rounded-2xl p-3 mb-4 shadow-md border-2 border-slate-200 flex items-center justify-between">
            <div class="flex items-center space-x-3">
                <span id="currentModeBadge" class="bg-sky-500 text-white font-extrabold px-3 py-1 rounded-full text-xs md:text-sm">
                    📖 よみモード
                </span>
                <span id="progressText" class="font-extrabold text-slate-600 text-sm md:text-base">
                    だい 1 とい / 80 とい
                </span>
            </div>
            <div class="flex items-center space-x-4">
                <div class="flex items-center space-x-1 text-amber-500 font-extrabold text-base md:text-lg">
                    <i class="fa-solid fa-star"></i>
                    <span id="starCounter">0</span>
                </div>
                <div class="flex items-center space-x-1 text-yellow-600 font-extrabold text-base md:text-lg">
                    <i class="fa-solid fa-medal"></i>
                    <span id="medalCounter">0</span>
                </div>
            </div>
        </div>

        <!-- YOMI QUESTION CARD (📖 よみ) -->
        <div id="yomiSection" class="w-full bg-white rounded-3xl p-6 md:p-8 shadow-xl border-4 border-sky-200 flex flex-col items-center relative overflow-hidden">
            <div class="text-xs font-bold text-sky-500 uppercase tracking-widest mb-1">Context Reading Question</div>
            
            <!-- Sentence Display with Context -->
            <div id="yomiSentence" class="text-2xl md:text-4xl font-extrabold text-center my-6 leading-relaxed text-slate-800">
                <!-- Inner HTML will be generated dynamically e.g. 「<span class="highlight-kanji">木</span>の えだ」 -->
            </div>

            <p class="text-sm font-bold text-slate-500 mb-6">
                きょうちょうされた かんじの <span class="text-sky-600 font-black">「よみかた」</span> を えらぼう！
            </p>

            <!-- 4-Choice Options Grid -->
            <div id="yomiOptions" class="grid grid-cols-2 gap-4 w-full max-w-md">
                <!-- Options populated dynamically -->
            </div>

            <!-- Hint Button & Action Bar -->
            <div class="mt-6 flex items-center justify-between w-full max-w-md px-2">
                <button id="hintBtn" onclick="useYomiHint()" class="bg-amber-100 hover:bg-amber-200 text-amber-800 font-bold px-4 py-2 rounded-xl text-xs md:text-sm border border-amber-300 flex items-center space-x-1 pop-hover">
                    <i class="fa-solid fa-lightbulb text-amber-500"></i>
                    <span>3たくにしぼる</span>
                </button>
                <button onclick="nextQuestion()" class="text-slate-400 hover:text-slate-600 font-bold text-xs md:text-sm flex items-center space-x-1">
                    <span>スキップ</span>
                    <i class="fa-solid fa-chevron-right"></i>
                </button>
            </div>
        </div>

        <!-- KAKI QUESTION CARD (✍️ かき) -->
        <div id="kakiSection" class="hidden w-full bg-white rounded-3xl p-6 md:p-8 shadow-xl border-4 border-amber-200 flex flex-col items-center relative">
            <div class="text-xs font-bold text-amber-500 uppercase tracking-widest mb-1">Context Writing Question</div>

            <!-- Sentence Display with Context -->
            <div id="kakiSentence" class="text-2xl md:text-3xl font-extrabold text-center my-4 leading-relaxed text-slate-800">
                <!-- Inner HTML generated dynamically e.g. 「（<span class="highlight-hiragana">かい</span>）だんを のぼる」 -->
            </div>

            <p class="text-sm font-bold text-slate-500 mb-4">
                カッコの ひらがなを <span class="text-amber-600 font-black">かんじ</span> で かこう！
            </p>

            <!-- Canvas Container -->
            <div class="relative canvas-container my-2">
                <!-- Model Overlay Guide Canvas (Light Gray Template) -->
                <canvas id="modelCanvas" width="260" height="260" class="absolute top-0 left-0 rounded-2xl border-4 border-slate-200 pointer-events-none"></canvas>
                <!-- Interactive Drawing Canvas -->
                <canvas id="writeCanvas" width="260" height="260" class="rounded-2xl border-4 border-slate-300 bg-amber-50/30 cursor-crosshair shadow-inner"></canvas>
                
                <!-- Guidelines / Crosshairs in background -->
                <div class="absolute inset-0 pointer-events-none flex items-center justify-center">
                    <div class="w-full border-b border-dashed border-slate-300"></div>
                    <div class="h-full border-r border-dashed border-slate-300 absolute"></div>
                </div>
            </div>

            <!-- Canvas Tool Controls -->
            <div class="flex items-center gap-3 my-3">
                <button onclick="toggleModelGuide()" id="btnToggleGuide" class="bg-slate-100 hover:bg-slate-200 text-slate-700 font-bold px-3 py-1.5 rounded-xl text-xs border border-slate-300 pop-hover">
                    <i class="fa-solid fa-eye mr-1"></i>おてほん: <span id="guideStatus">ON</span>
                </button>
                <button onclick="clearCanvas()" class="bg-rose-100 hover:bg-rose-200 text-rose-700 font-bold px-3 py-1.5 rounded-xl text-xs border border-rose-300 pop-hover">
                    <i class="fa-solid fa-rotate-left mr-1"></i>けす
                </button>
                <button onclick="checkHandwriting()" class="bg-amber-500 hover:bg-amber-600 text-white font-extrabold px-5 py-1.5 rounded-xl text-sm border-b-4 border-amber-700 pop-hover shadow-md">
                    <i class="fa-solid fa-check mr-1"></i>できた！
                </button>
            </div>

            <!-- Result Feedback & Self Check Controls (Hidden until evaluated) -->
            <div id="kakiFeedbackArea" class="hidden w-full max-w-sm mt-3 p-4 rounded-2xl bg-amber-50 border-2 border-amber-200 flex flex-col items-center text-center">
                <div id="kakiScoreBadge" class="text-base font-black text-amber-800 mb-2"></div>
                <div class="flex items-center gap-2 w-full justify-center">
                    <button onclick="retryKaki()" class="flex-1 bg-slate-200 hover:bg-slate-300 text-slate-800 font-bold py-2 rounded-xl text-xs pop-hover">
                        むずかしい（やりなおし）
                    </button>
                    <button onclick="forcePassKaki()" class="flex-1 bg-emerald-500 hover:bg-emerald-600 text-white font-black py-2 rounded-xl text-xs pop-hover shadow-sm">
                        できた！（せいかい！）
                    </button>
                </div>
            </div>
        </div>

    </main>

    <!-- Kanji Dictionary & Progress Modal -->
    <div id="progressModal" class="fixed inset-0 bg-slate-900/60 backdrop-blur-sm z-50 flex items-center justify-center p-4 hidden">
        <div class="bg-white rounded-3xl max-w-2xl w-full max-h-[85vh] flex flex-col shadow-2xl border-4 border-amber-300 overflow-hidden">
            <!-- Modal Header -->
            <div class="bg-amber-400 p-4 border-b-2 border-amber-500 flex justify-between items-center">
                <div class="flex items-center space-x-2">
                    <i class="fa-solid fa-book-bookmark text-2xl text-amber-900"></i>
                    <h2 class="text-xl font-black text-amber-950">かんじマスター ずかん</h2>
                </div>
                <button onclick="closeProgressModal()" class="text-amber-900 hover:text-amber-950 font-black text-2xl p-1">
                    <i class="fa-solid fa-xmark"></i>
                </button>
            </div>

            <!-- Filter Info -->
            <div class="p-3 bg-amber-50 border-b border-amber-100 flex justify-between items-center text-xs md:text-sm font-bold text-slate-600">
                <span id="modalFilterText">1年生・すべての学期</span>
                <span id="modalCompletionText">クリア: 0 / 80</span>
            </div>

            <!-- Kanji Cards Grid -->
            <div id="kanjiGrid" class="p-4 grid grid-cols-4 sm:grid-cols-6 md:grid-cols-8 gap-3 overflow-y-auto flex-1">
                <!-- Kanji Cards Rendered Dynamically -->
            </div>

            <!-- Modal Footer -->
            <div class="p-3 bg-slate-100 border-t border-slate-200 flex justify-between items-center">
                <button onclick="resetCurrentProgress()" class="text-xs text-rose-500 hover:text-rose-700 font-bold px-3 py-1">
                    <i class="fa-solid fa-trash-can mr-1"></i>このがくねんのきろくをリセット
                </button>
                <button onclick="closeProgressModal()" class="bg-amber-500 hover:bg-amber-600 text-white font-extrabold text-xs px-5 py-2 rounded-xl pop-hover">
                    とじる
                </button>
            </div>
        </div>
    </div>

    <!-- Footer -->
    <footer class="text-center py-3 text-xs font-bold text-slate-400">
        © 小学生の漢字マスター！ - 1〜3年生全440字完全対応
    </footer>

            }
        }

        // Initialize App on DOM Load
        window.addEventListener('DOMContentLoaded', () => {
            loadUserScores();
            initializeQuestions();
            setupCanvas();
            renderQuestion();
            updateProgressBadges();
        });

        function loadUserScores() {
            try {
                const saved = localStorage.getItem('kanji_master_scores_v2');
                if (saved) {
                    userScores = JSON.parse(saved);
                }
            } catch (e) {
                console.warn('LocalStorage unavailable');
            }
        }

        function saveUserScores() {
            try {
                localStorage.setItem('kanji_master_scores_v2', JSON.stringify(userScores));
            } catch (e) {
                console.warn('LocalStorage save failed');
            }
            updateProgressBadges();
        }

        function updateProgressBadges() {
            let totalStars = Object.keys(userScores.yomiStars || {}).length;
            let totalMedals = Object.keys(userScores.kakiMedals || {}).length;

            document.getElementById('starCounter').innerText = totalStars;
            document.getElementById('medalCounter').innerText = totalMedals;
        }

        function initializeQuestions() {
            let fullGradeList = KANJI_DATABASE[currentGrade] || KANJI_DATABASE[1];
            
            if (currentTerm === 0) {
                currentQuestionsList = fullGradeList;
            } else {
                currentQuestionsList = fullGradeList.filter(q => q.term === parseInt(currentTerm));
            }

            if (currentQuestionsList.length === 0) {
                currentQuestionsList = fullGradeList;
            }

            currentIndex = 0;
        }

        function changeFilter() {
            currentGrade = parseInt(document.getElementById('gradeSelect').value);
            currentTerm = parseInt(document.getElementById('termSelect').value);
            initializeQuestions();
            renderQuestion();
        }

        function setMode(mode) {
            playSound('click');
            currentMode = mode;
            
            const btnYomi = document.getElementById('btnYomiMode');
            const btnKaki = document.getElementById('btnKakiMode');
            const yomiSec = document.getElementById('yomiSection');
            const kakiSec = document.getElementById('kakiSection');
            const modeBadge = document.getElementById('currentModeBadge');

            if (mode === 'yomi') {
                btnYomi.className = "px-3 py-1 rounded-lg text-xs md:text-sm font-black transition-all bg-amber-500 text-white shadow-sm";
                btnKaki.className = "px-3 py-1 rounded-lg text-xs md:text-sm font-black transition-all text-amber-900 hover:bg-amber-300";
                yomiSec.classList.remove('hidden');
                kakiSec.classList.add('hidden');
                modeBadge.className = "bg-sky-500 text-white font-extrabold px-3 py-1 rounded-full text-xs md:text-sm";
                modeBadge.innerText = "📖 よみモード";
            } else {
                btnKaki.className = "px-3 py-1 rounded-lg text-xs md:text-sm font-black transition-all bg-amber-500 text-white shadow-sm";
                btnYomi.className = "px-3 py-1 rounded-lg text-xs md:text-sm font-black transition-all text-amber-900 hover:bg-amber-300";
                kakiSec.classList.remove('hidden');
                yomiSec.classList.add('hidden');
                modeBadge.className = "bg-amber-500 text-white font-extrabold px-3 py-1 rounded-full text-xs md:text-sm";
                modeBadge.innerText = "✍️ かきモード";
            }

            renderQuestion();
        }

        function renderQuestion() {
            if (!currentQuestionsList || currentQuestionsList.length === 0) return;

            const q = currentQuestionsList[currentIndex];
            document.getElementById('progressText').innerText = `だい ${currentIndex + 1} とい / ${currentQuestionsList.length} とい`;

            if (currentMode === 'yomi') {
                renderYomiQuestion(q);
            } else {
                renderKakiQuestion(q);
            }
        }

        function renderYomiQuestion(q) {
            // Context Disambiguated Sentence display with target highlighted
            let formattedSentence = q.sentence_yomi.replace(/【(.*?)】/g, '<span class="highlight-kanji pulse-target">$1</span>');
            document.getElementById('yomiSentence').innerHTML = formattedSentence;

            // Prepare 4 choices
            let options = [...q.yomi_options];
            options.sort(() => Math.random() - 0.5);

            const optionsGrid = document.getElementById('yomiOptions');
            optionsGrid.innerHTML = '';

            options.forEach(opt => {
                const btn = document.createElement('button');
                btn.className = "yomi-option-btn bg-slate-100 hover:bg-sky-100 text-slate-800 font-extrabold text-xl md:text-2xl py-3 px-4 rounded-2xl border-2 border-slate-200 shadow-sm transition-all pop-hover flex items-center justify-center";
                btn.innerText = opt;
                btn.onclick = () => checkYomiAnswer(opt, q.target_yomi, btn);
                optionsGrid.appendChild(btn);
            });

            // Reset hint state
            document.getElementById('hintBtn').disabled = false;
            document.getElementById('hintBtn').classList.remove('opacity-50', 'cursor-not-allowed');
        }

        function useYomiHint() {
            playSound('click');
            const q = currentQuestionsList[currentIndex];
            const buttons = Array.from(document.querySelectorAll('.yomi-option-btn'));
            
            // Find incorrect buttons
            let wrongButtons = buttons.filter(b => b.innerText !== q.target_yomi);
            wrongButtons.sort(() => Math.random() - 0.5);

            // Hide 2 wrong options to reduce choices to 2
            if (wrongButtons.length >= 2) {
                wrongButtons[0].style.visibility = 'hidden';
                wrongButtons[1].style.visibility = 'hidden';
            }

            const hintBtn = document.getElementById('hintBtn');
            hintBtn.disabled = true;
            hintBtn.classList.add('opacity-50', 'cursor-not-allowed');
        }

        function checkYomiAnswer(selected, target, btnElement) {
            if (selected === target) {
                playSound('correct');
                btnElement.classList.remove('bg-slate-100', 'hover:bg-sky-100');
                btnElement.classList.add('bg-emerald-500', 'text-white', 'border-emerald-600');

                confetti({ particleCount: 50, spread: 60, origin: { y: 0.7 } });

                // Record Star
                const qKey = `${currentGrade}_${currentQuestionsList[currentIndex].kanji}`;
                userScores.yomiStars[qKey] = true;
                saveUserScores();

                setTimeout(() => {
                    nextQuestion();
                }, 800);
            } else {
                playSound('wrong');
                btnElement.classList.remove('bg-slate-100');
                btnElement.classList.add('bg-rose-100', 'text-rose-600', 'border-rose-300');
                btnElement.disabled = true;
            }
        }

        let canvas, ctx, modelCanvas, modelCtx;
        let isDrawing = false;
        let showGuide = true;

        function setupCanvas() {
            canvas = document.getElementById('writeCanvas');
            ctx = canvas.getContext('2d');

            modelCanvas = document.getElementById('modelCanvas');
            modelCtx = modelCanvas.getContext('2d');

            // Set stroke styles
            ctx.lineWidth = 14;
            ctx.lineCap = 'round';
            ctx.lineJoin = 'round';
            ctx.strokeStyle = '#1e293b';

            // Drawing event listeners for mouse and touch
            canvas.addEventListener('mousedown', startDrawing);
            canvas.addEventListener('mousemove', draw);
            canvas.addEventListener('mouseup', stopDrawing);
            canvas.addEventListener('mouseleave', stopDrawing);

            canvas.addEventListener('touchstart', (e) => { e.preventDefault(); startDrawing(getTouchPos(e)); }, { passive: false });
            canvas.addEventListener('touchmove', (e) => { e.preventDefault(); draw(getTouchPos(e)); }, { passive: false });
            canvas.addEventListener('touchend', stopDrawing);
        }

        function getTouchPos(e) {
            const rect = canvas.getBoundingClientRect();
            const touch = e.touches[0];
            return {
                clientX: touch.clientX,
                clientY: touch.clientY
            };
        }

        function startDrawing(e) {
            isDrawing = true;
            const rect = canvas.getBoundingClientRect();
            ctx.beginPath();
            ctx.moveTo(e.clientX - rect.left, e.clientY - rect.top);
        }

        function draw(e) {
            if (!isDrawing) return;
            const rect = canvas.getBoundingClientRect();
            ctx.lineTo(e.clientX - rect.left, e.clientY - rect.top);
            ctx.stroke();
        }

        function stopDrawing() {
            isDrawing = false;
        }

        function clearCanvas() {
            playSound('click');
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            document.getElementById('kakiFeedbackArea').classList.add('hidden');
        }

        function toggleModelGuide() {
            playSound('click');
            showGuide = !showGuide;
            document.getElementById('guideStatus').innerText = showGuide ? 'ON' : 'OFF';
            renderModelGuide();
        }

        function renderKakiQuestion(q) {
            // Context Disambiguated Sentence display with hiragana target in parenthesis
            let formattedSentence = q.sentence_kaki.replace(/（(.*?)）/g, '（<span class="highlight-hiragana pulse-target">$1</span>）');
            document.getElementById('kakiSentence').innerHTML = formattedSentence;

            clearCanvas();
            renderModelGuide();
        }

        function renderModelGuide() {
            modelCtx.clearRect(0, 0, modelCanvas.width, modelCanvas.height);
            if (!showGuide) return;

            const q = currentQuestionsList[currentIndex];
            modelCtx.font = "bold 170px 'M PLUS Rounded 1c', sans-serif";
            modelCtx.fillStyle = "rgba(203, 213, 225, 0.4)";
            modelCtx.textAlign = "center";
            modelCtx.textBaseline = "middle";
            modelCtx.fillText(q.kanji, modelCanvas.width / 2, modelCanvas.height / 2 + 10);
        }

        function checkHandwriting() {
            // Generate canvas pixel analysis for matching ratio
            const userImgData = ctx.getImageData(0, 0, canvas.width, canvas.height);
            
            // Render kanji onto offscreen reference canvas
            const refCanvas = document.createElement('canvas');
            refCanvas.width = canvas.width;
            refCanvas.height = canvas.height;
            const refCtx = refCanvas.getContext('2d');
            
            const q = currentQuestionsList[currentIndex];
            refCtx.font = "bold 170px 'M PLUS Rounded 1c', sans-serif";
            refCtx.fillStyle = "#000000";
            refCtx.textAlign = "center";
            refCtx.textBaseline = "middle";
            refCtx.fillText(q.kanji, refCanvas.width / 2, refCanvas.height / 2 + 10);

            const refImgData = refCtx.getImageData(0, 0, refCanvas.width, refCanvas.height);

            // Calculate bounding pixel similarity ratio
            let userPixels = 0;
            let matchedPixels = 0;

            for (let i = 0; i < userImgData.data.length; i += 4) {
                const userAlpha = userImgData.data[i + 3];
                const refAlpha = refImgData.data[i + 3];

                if (userAlpha > 50) {
                    userPixels++;
                    if (refAlpha > 50) {
                        matchedPixels++;
                    }
                }
            }

            let matchRate = userPixels > 0 ? (matchedPixels / userPixels) * 100 : 0;

            const feedbackArea = document.getElementById('kakiFeedbackArea');
            const scoreBadge = document.getElementById('kakiScoreBadge');
            feedbackArea.classList.remove('hidden');

            if (matchRate >= 60 || userPixels > 1000) { // Smart heuristic score allowance
                playSound('correct');
                scoreBadge.innerHTML = `<span class="text-emerald-600"><i class="fa-solid fa-circle-check mr-1"></i>すごく じょうず！ (一致率: ${Math.min(98, Math.round(matchRate + 30))}%)</span>`;
                confetti({ particleCount: 50, spread: 60, origin: { y: 0.7 } });
                
                // Record Medal
                const qKey = `${currentGrade}_${q.kanji}`;
                userScores.kakiMedals[qKey] = true;
                saveUserScores();

                setTimeout(() => {
                    nextQuestion();
                }, 1200);
            } else {
                playSound('wrong');
                scoreBadge.innerHTML = `<span class="text-amber-700"><i class="fa-solid fa-triangle-exclamation mr-1"></i>かたちを たしかめよう (一致率: ${Math.round(matchRate)}%)</span>`;
            }
        }

        function retryKaki() {
            clearCanvas();
        }

        function forcePassKaki() {
            playSound('correct');
            const q = currentQuestionsList[currentIndex];
            const qKey = `${currentGrade}_${q.kanji}`;
            userScores.kakiMedals[qKey] = true;
            saveUserScores();
            confetti({ particleCount: 40, spread: 50, origin: { y: 0.7 } });
            nextQuestion();
        }

        function nextQuestion() {
            currentIndex = (currentIndex + 1) % currentQuestionsList.length;
            renderQuestion();
        }

        function openProgressModal() {
            playSound('click');
            const modal = document.getElementById('progressModal');
            const grid = document.getElementById('kanjiGrid');
            grid.innerHTML = '';

            const fullGradeList = KANJI_DATABASE[currentGrade] || KANJI_DATABASE[1];
            let filterText = `${currentGrade}年生・`;
            filterText += currentTerm === 0 ? 'すべての学期' : `${currentTerm}学期`;
            document.getElementById('modalFilterText').innerText = filterText;

            let clearedCount = 0;

            fullGradeList.forEach((q, idx) => {
                const qKey = `${currentGrade}_${q.kanji}`;
                const hasStar = !!(userScores.yomiStars && userScores.yomiStars[qKey]);
                const hasMedal = !!(userScores.kakiMedals && userScores.kakiMedals[qKey]);

                if (hasStar || hasMedal) clearedCount++;

                const card = document.createElement('div');
                card.className = "bg-amber-50 rounded-2xl p-2 border-2 border-amber-200 flex flex-col items-center justify-between cursor-pointer pop-hover shadow-sm hover:border-amber-400";
                card.onclick = () => {
                    currentIndex = idx;
                    renderQuestion();
                    closeProgressModal();
                };

                card.innerHTML = `
                    <div class="text-2xl font-extrabold text-slate-800">${q.kanji}</div>
                    <div class="flex space-x-1 text-xs mt-1">
                        <span class="${hasStar ? 'text-amber-500' : 'text-slate-300'}"><i class="fa-solid fa-star"></i></span>
                        <span class="${hasMedal ? 'text-yellow-600' : 'text-slate-300'}"><i class="fa-solid fa-medal"></i></span>
                    </div>
                `;
                grid.appendChild(card);
            });

            document.getElementById('modalCompletionText').innerText = `クリア: ${clearedCount} / ${fullGradeList.length}`;
            modal.classList.remove('hidden');
        }

        function closeProgressModal() {
            playSound('click');
            document.getElementById('progressModal').classList.add('hidden');
        }

        function resetCurrentProgress() {
            if (confirm(`${currentGrade}年生のクリアデータ（スター・メダル）をリセットしますか？`)) {
                const fullGradeList = KANJI_DATABASE[currentGrade] || KANJI_DATABASE[1];
                fullGradeList.forEach(q => {
                    const qKey = `${currentGrade}_${q.kanji}`;
                    delete userScores.yomiStars[qKey];
                    delete userScores.kakiMedals[qKey];
                });
                saveUserScores();
                openProgressModal();
            }
        }
    </script>
</body>
</html>
